name: Excellence Live Registry
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "excellence/registry/**"
      - "site-v15/data/excellence-multi-repo-catalog.json"
      - ".github/workflows/excellence-live-registry.yml"
  push:
    branches:
      - main
    paths:
      - "excellence/registry/**"
      - "site-v15/data/excellence-multi-repo-catalog.json"
      - ".github/workflows/excellence-live-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify registry logic
        run: python -m unittest discover -s excellence/registry/tests -p 'test_*.py' -v
      - name: Inspect all 37 live repositories
        id: live-census
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python excellence/registry/build_registry.py
      - name: Derive gate priority queue
        id: priority-queue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python excellence/registry/build_priority_queue.py
      - name: Publish census artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: excellence-live-registry-${{ github.sha }}
          if-no-files-found: error
          path: |
            excellence/registry/excellence-repo-registry.json
            excellence/registry/excellence-priority-queue.json
      - name: Fail after preserving diagnostics
        if: always() && (steps.live-census.outcome == 'failure' || steps.priority-queue.outcome == 'failure')
        run: exit 1
