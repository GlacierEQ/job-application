name: V31 Full Estate Production

on:
  pull_request:
    branches: [main]
    paths:
      - "site-v15/**"
      - "deployment/vercel-source-bridge/**"
      - "scripts/render-full-estate-explorer.mjs"
      - "scripts/normalize-full-estate-design.mjs"
      - "scripts/validate-full-estate-explorer.mjs"
      - "scripts/build-v31-full-estate-production.mjs"
      - "scripts/verify-v31-deployment.mjs"
      - "scripts/build-v25-deployment-bundle.mjs"
      - "scripts/build-v25-effective-production.mjs"
      - "scripts/compress-recruiter-surface.mjs"
      - ".github/workflows/v31-full-estate-production.yml"
  push:
    branches: [main]
    paths:
      - "site-v15/**"
      - "deployment/vercel-source-bridge/**"
      - "scripts/render-full-estate-explorer.mjs"
      - "scripts/normalize-full-estate-design.mjs"
      - "scripts/validate-full-estate-explorer.mjs"
      - "scripts/build-v31-full-estate-production.mjs"
      - "scripts/verify-v31-deployment.mjs"
      - "scripts/build-v25-deployment-bundle.mjs"
      - "scripts/build-v25-effective-production.mjs"
      - "scripts/compress-recruiter-surface.mjs"
      - ".github/workflows/v31-full-estate-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v31-full-estate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXACT_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Materialize current recruiter surface
        run: |
          set -euo pipefail
          node scripts/sync-helix-projection-effective.mjs
          node scripts/reconcile-helix-company-cardinality.mjs
          node scripts/reconcile-v21-runtime-stars.mjs
          node scripts/validate-helix-projection.mjs
          node scripts/render-helix-atlas.mjs
          node scripts/link-helix-atlas.mjs
          node scripts/project-estate-intelligence.mjs
          node scripts/render-full-estate-explorer.mjs
          node scripts/normalize-full-estate-design.mjs
          node scripts/validate-full-estate-explorer.mjs
          node scripts/apply-complete-web-design.mjs
          node scripts/validate-estate-intelligence.mjs
          node scripts/validate-helix-atlas.mjs
          node scripts/harden-public-proof-surface.mjs
          node scripts/preserve-private-capability-cards.mjs
          node scripts/validate-public-proof-surface.mjs
          node scripts/compress-recruiter-surface.mjs
          node scripts/compress-recruiter-surface.mjs --check
          node scripts/normalize-full-estate-design.mjs --check
          node scripts/validate-full-estate-explorer.mjs
          node site-v15/scripts/validate.mjs

      - name: Build proven V25 runtime as preserved inner engine
        run: |
          set -euo pipefail
          HELIX_COMMIT="$(node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('site-v15/data/helix-root.receipt.json','utf8')); if(!/^[a-f0-9]{40}$/.test(r.source_commit||'')) process.exit(2); process.stdout.write(r.source_commit)")"
          node scripts/build-v25-effective-production.mjs \
            --source-commit "$EXACT_SOURCE_SHA" \
            --helix-commit "$HELIX_COMMIT" \
            --output-dir artifacts/v25-inner

      - name: Build self-contained V31 production overlay
        run: |
          set -euo pipefail
          node scripts/build-v31-full-estate-production.mjs \
            --source-commit "$EXACT_SOURCE_SHA" \
            --v25-dir artifacts/v25-inner \
            --output-dir artifacts/v31-deployment
          node --check artifacts/v31-deployment/api/index.js
          node scripts/verify-v31-deployment.mjs --bundle-dir artifacts/v31-deployment

      - name: Verify exact deployable file contract
        run: |
          set -euo pipefail
          test -s artifacts/v31-deployment/api/index.js
          test -s artifacts/v31-deployment/vercel.json
          test -s artifacts/v31-deployment/deployment-manifest.json
          test "$(node -e "const m=require('./artifacts/v31-deployment/deployment-manifest.json'); process.stdout.write(String(m.deployment_files.length))")" = "2"
          test "$(node -e "const m=require('./artifacts/v31-deployment/deployment-manifest.json'); process.stdout.write(m.source_commit)")" = "$EXACT_SOURCE_SHA"

      - name: Upload exact deployable production package
        uses: actions/upload-artifact@v4
        with:
          name: v31-full-estate-production-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/v31-deployment
          if-no-files-found: error
          retention-days: 30
