name: APEX V29 Rebind Source

on:
  push:
    branches:
      - apex/v29-proof-routing-recovery-20260817
    paths:
      - '.github/workflows/apex-v29-rebind-source.yml'

permissions:
  contents: write

jobs:
  rebind-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebind V29 to the current immutable portfolio authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deployment/vercel-source-bridge/api/inventions-proxy.js')
          text = path.read_text()
          old = "const PORTFOLIO_COMMIT = 'b4ed2a05182e1e055ed4e9d59e59a0aab21097ad';"
          new = "const PORTFOLIO_COMMIT = 'e870a5153bb38d533540e44c888759a8cd3b7169';"
          if text.count(old) != 1:
              raise SystemExit('v29_portfolio_source_anchor_missing_or_ambiguous')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Prove focused V29 runtime
        run: node --test deployment/vercel-source-bridge/inventions-proxy.test.js
      - name: Prove full native repository
        run: npm test
      - name: Persist exact-source rebind
        run: |
          git config user.name 'GlacierEQ APEX'
          git config user.email 'glacier.equilibrium@gmail.com'
          git add deployment/vercel-source-bridge/api/inventions-proxy.js
          git diff --cached --check
          git commit -m 'fix(v29): bind proof routing to current portfolio source'
          git push origin HEAD:apex/v29-proof-routing-recovery-20260817
