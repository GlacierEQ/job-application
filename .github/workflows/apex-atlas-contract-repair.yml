name: APEX Atlas Contract Repair

on:
  push:
    branches:
      - apex/job-restore-atlas-runtime-20260816
    paths:
      - '.github/workflows/apex-atlas-contract-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apex/job-restore-atlas-runtime-20260816
      - name: Remove arbitrary ceiling and make reconciliation idempotent
        shell: python
        run: |
          from pathlib import Path

          renderer_path = Path('scripts/render-helix-atlas.mjs')
          renderer = renderer_path.read_text()
          guard = '''  if (companies.length > 512) {
            throw new Error("constellation supports at most 512 governed company positions");
          }

          '''
          if guard in renderer:
              renderer = renderer.replace(guard, '', 1)
          if 'const radialStep = rings.length > 1 ? 30 / (rings.length - 1) : 0;' not in renderer:
              raise SystemExit('adaptive renderer formula missing')
          renderer_path.write_text(renderer)

          reconcile_path = Path('scripts/reconcile-helix-company-cardinality.mjs')
          text = reconcile_path.read_text()
          start = text.index('function scaleAtlasRenderer(source) {')
          end = text.index('\n}\n\nconst snapshotText', start) + 2
          replacement = '''function scaleAtlasRenderer(source) {
            const adaptiveRadiusPattern = /const radialStep = rings\\.length > 1 \\? 30 \\/ \\(rings\\.length - 1\\) : 0;\\n    const radius = 16 \\+ r \\* radialStep;/;
            const legacyRadiusPattern = /const radius = 21 \\+ r \\* 12; \\/\\/ 21%, 33%, 45%, 57%, \\.\\.\\./;
            const guardPattern = /\\n  if \\(companies\\.length > \\d+\\) \\{\\n    throw new Error\\("constellation supports at most \\d+ governed company positions"\\);\\n  \\}\\n/;
            let next = source;

            // The renderer owns scalable geometry. Reconciliation may migrate the old fixed
            // formula, but an already-scaled renderer is a valid terminal state, not an error.
            if (guardPattern.test(next)) next = next.replace(guardPattern, '\\n');
            if (adaptiveRadiusPattern.test(next)) {
              return { source: next, changed: next !== source };
            }
            if (!legacyRadiusPattern.test(next)) {
              throw new Error('render-helix-atlas.mjs: neither adaptive nor legacy constellation radius contract found');
            }
            next = next.replace(
              legacyRadiusPattern,
              'const radialStep = rings.length > 1 ? 30 / (rings.length - 1) : 0;\\n    const radius = 16 + r * radialStep;',
            );
            return { source: next, changed: next !== source };
          }'''.replace('          ', '')
          text = text[:start] + replacement + text[end:]

          old_assert = '''if (!rendererSource.includes('16 + (31 * r) / (rings.length - 1)')) {
            throw new Error('render-helix-atlas.mjs: bounded scalable ring radius missing');
          }'''.replace('          ', '')
          new_assert = '''if (!rendererSource.includes('const radialStep = rings.length > 1 ? 30 / (rings.length - 1) : 0;') ||
              !rendererSource.includes('const radius = 16 + r * radialStep;')) {
            throw new Error('render-helix-atlas.mjs: bounded adaptive ring radius missing');
          }'''.replace('          ', '')
          if old_assert not in text:
              raise SystemExit('renderer scalability assertion not found')
          text = text.replace(old_assert, new_assert, 1)
          reconcile_path.write_text(text)
      - name: Execute current 166-company reconciliation and restored interaction
        run: |
          set -euo pipefail
          node --check scripts/render-helix-atlas.mjs
          node --check scripts/reconcile-helix-company-cardinality.mjs
          node scripts/reconcile-helix-company-cardinality.mjs
          node scripts/render-helix-atlas.mjs
          node scripts/activate-atlas-runtime.mjs
          node scripts/validate-atlas-interaction.mjs
          node --test tests/atlas-runtime.test.mjs
      - name: Commit coherent repair
        run: |
          git config user.name 'casey'
          git config user.email 'GLACIER.EQUILIBRIUM@GMAIL.COM'
          git add scripts/render-helix-atlas.mjs scripts/reconcile-helix-company-cardinality.mjs site-v15/atlas/index.html site-v15/assets/helix-atlas.stars.css site-v15/companies || true
          if git diff --cached --quiet; then
            echo 'No source delta produced.'
            exit 0
          fi
          git commit -m 'restore: remove Atlas cardinality ceiling and reconcile adaptive geometry'
          git push origin HEAD:apex/job-restore-atlas-runtime-20260816
