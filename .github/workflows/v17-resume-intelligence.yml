name: V17 Resume Intelligence

on:
  pull_request:
    paths:
      - 'site-v15/resume/**'
      - 'site-v15/assets/resume.v17.css'
      - 'site-v15/data/resume.json'
      - 'site-v15/data/resume-artifacts.json'
      - 'site-v15/downloads/Casey_Barton_Resume.*'
      - 'site-v15/llms.txt'
      - 'site-v15/scripts/generate-resume-v17.py'
      - 'site-v15/scripts/validate.mjs'
      - 'site-v15/scripts/validate-resume-v17.mjs'
      - 'RESUME_ATS.md'
      - '.github/workflows/v17-resume-intelligence.yml'
      - 'deployment-receipts/V17_*'
  push:
    branches:
      - main
      - release/v16-signal-architecture
    paths:
      - 'site-v15/resume/**'
      - 'site-v15/assets/resume.v17.css'
      - 'site-v15/data/resume.json'
      - 'site-v15/data/resume-artifacts.json'
      - 'site-v15/downloads/Casey_Barton_Resume.*'
      - 'site-v15/llms.txt'
      - 'site-v15/scripts/generate-resume-v17.py'
      - 'site-v15/scripts/validate.mjs'
      - 'site-v15/scripts/validate-resume-v17.mjs'
      - 'RESUME_ATS.md'
      - '.github/workflows/v17-resume-intelligence.yml'
      - 'deployment-receipts/V17_*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic document generators
        run: python -m pip install --disable-pip-version-check reportlab==4.4.3 python-docx==1.2.0
      - name: Regenerate artifacts from committed source
        run: python site-v15/scripts/generate-resume-v17.py
      - name: Preserve V16 factual invariance
        run: node site-v15/scripts/validate.mjs
      - name: Validate V17 resume intelligence
        run: |
          set -o pipefail
          mkdir -p .verification-artifacts
          node site-v15/scripts/validate-resume-v17.mjs | tee .verification-artifacts/v17-resume-validation.json
          test -s .verification-artifacts/v17-resume-validation.json
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('.verification-artifacts/v17-resume-validation.json', 'utf8'));
          if (receipt.status !== 'PASS' || receipt.schema !== 'glaciereq.resume-intelligence-validation.v17' || receipt.facts_invariant !== true) {
            throw new Error('V17 validation receipt contract failed');
          }
          NODE
      - name: Prove committed artifact reproducibility
        run: git diff --exit-code -- site-v15/downloads/Casey_Barton_Resume.pdf site-v15/downloads/Casey_Barton_Resume.docx site-v15/data/resume-artifacts.json
      - name: Hash validation receipt
        run: sha256sum .verification-artifacts/v17-resume-validation.json > .verification-artifacts/v17-resume-validation.sha256
      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: v17-resume-intelligence-receipt
          path: .verification-artifacts/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
