name: Fix Mission Agentic AI Assurance

on:
  push:
    branches:
      - webdev/v21-mission-agentic-ai-assurance
    paths:
      - ".github/workflows/fix-mission-agentic-ai-assurance.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webdev/v21-mission-agentic-ai-assurance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize bounded project
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff
          python - <<'PY'
          from pathlib import Path
          root = Path('projects/mission-agentic-ai-assurance')
          for relative in ['scripts/demo.py', 'scripts/verify_proof.py']:
              path = root / relative
              text = path.read_text()
              if text.startswith('#!/usr/bin/env python3\n'):
                  path.write_text(text.split('\n', 1)[1])
          core = root / 'src/mission_assurance/core.py'
          text = core.read_text()
          text = text.replace(
              'except Exception as error:  # executor boundary is intentionally broad',
              'except Exception as error:  # noqa: BLE001',
          )
          core.write_text(text)
          PY
          ruff check --fix projects/mission-agentic-ai-assurance
          ruff format projects/mission-agentic-ai-assurance
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          root = Path('projects/mission-agentic-ai-assurance')
          path = root / 'proof/proof_manifest.json'
          manifest = json.loads(path.read_text())
          manifest['governed_files'] = {
              relative: sha256((root / relative).read_bytes()).hexdigest()
              for relative in manifest['governed_files']
          }
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          cd projects/mission-agentic-ai-assurance
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/demo.py > /tmp/mission-assurance-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/mission-assurance-receipt.json').read_text()) == json.loads(Path('proof/reproduced_receipt.json').read_text())
          PY
          PYTHONPATH=src python scripts/verify_proof.py
      - name: Commit normalized project
        run: |
          set -euo pipefail
          git config user.name casey
          git config user.email GLACIER.EQUILIBRIUM@GMAIL.COM
          git add projects/mission-agentic-ai-assurance
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git commit -m 'fix: normalize mission assurance proof package'
          git push origin HEAD:webdev/v21-mission-agentic-ai-assurance
