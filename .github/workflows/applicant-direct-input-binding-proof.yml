name: Applicant Direct Input Binding Proof

on:
  push:
    branches: [main]
    paths:
      - "tools/bind_applicant_direct_inputs.py"
      - "tests/test_applicant_direct_input_binding.py"
      - ".github/workflows/applicant-direct-input-binding-proof.yml"
  pull_request:
    paths:
      - "tools/bind_applicant_direct_inputs.py"
      - "tests/test_applicant_direct_input_binding.py"
      - ".github/workflows/applicant-direct-input-binding-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile runtime
        run: |
          python -m py_compile \
            tools/bind_applicant_direct_inputs.py \
            tools/build_applicant_decision_inventory.py \
            tools/build_applicant_decision_packet.py
      - name: Run adversarial binding tests
        run: |
          python -m unittest \
            tests.test_applicant_direct_input_binding \
            tests.test_applicant_decision_inventory \
            tests.test_applicant_decision_packet
      - name: Exercise direct CLI
        run: python tools/bind_applicant_direct_inputs.py --help >/dev/null

# Exact-head PR execution is intentional: this workflow proves the live binding runtime,
# its adversarial composition tests, and direct CLI on every supported Python runtime.
