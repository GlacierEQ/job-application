name: Promote Effective Helix Projection
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
    inputs:
      helix_sha:
        description: "Exact canonical GlacierEQ/job-app-helix commit to project"
        required: true
        default: "82ab13cad82d005b1b9631fe32fa233443288268"

permissions:
  contents: write
  pull-requests: write

env:
  HELIX_ROOT_SHA: ${{ inputs.helix_sha }}

jobs:
  compile-validate-open-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout selected workflow ref without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Upgrade projection validator for modular second-depth distribution
        run: node scripts/upgrade-helix-projection-stage-validator.mjs

      - name: Compile exact effective Helix projection
        run: node scripts/sync-helix-projection-effective.mjs

      - name: Validate public-safe projection and receipt
        run: node scripts/validate-helix-projection.mjs

      - name: Render Company Atlas and real company routes
        run: node scripts/render-helix-atlas.mjs

      - name: Render recruiter-admitted Proof Starmap
        run: node scripts/render-helix-starmap.mjs

      - name: Validate Proof Starmap admission boundary
        run: node scripts/validate-helix-starmap.mjs

      - name: Link Atlas across public surfaces
        run: node scripts/link-helix-atlas.mjs

      - name: Validate generated Atlas, company routes, and links
        run: node scripts/validate-helix-atlas.mjs

      - name: Compile evidence-aware company constellation
        run: node scripts/render-company-constellation.mjs

      - name: Link company constellation across public surfaces
        run: node scripts/link-company-constellation.mjs

      - name: Validate company constellation and evidence boundaries
        run: node scripts/validate-company-constellation.mjs

      - name: Project source-bound estate intelligence
        run: node scripts/project-estate-intelligence.mjs

      - name: Validate estate-intelligence privacy and freshness boundaries
        run: node scripts/validate-estate-intelligence.mjs

      - name: Validate existing V17 hiring surface
        run: node site-v15/scripts/validate.mjs

      - name: Project recruiter-admitted company records into deployable JSON
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { admittedAtlasCompany } from './scripts/public-atlas-admission.mjs';
          const path = 'site-v15/data/helix-root.json';
          const snapshot = JSON.parse(readFileSync(path, 'utf8'));
          if (!Array.isArray(snapshot.companies)) throw new Error('Helix companies array missing');
          const sourceCount = snapshot.companies.length;
          const admitted = snapshot.companies.filter(admittedAtlasCompany);
          if (!admitted.length) throw new Error('No recruiter-admitted companies; refusing empty projection');
          snapshot.companies = admitted.map(company => ({
            ...company,
            repositories: company.repositories.filter(repo =>
              repo && repo.visibility === 'public' &&
              repo.inventory_scope === 'HELIX_ADMITTED' &&
              typeof repo.repository === 'string' &&
              repo.repository.startsWith('GlacierEQ/') && /^[A-Za-z0-9_.-]+$/.test(repo.repository.slice('GlacierEQ/'.length))
            ),
          }));
          // The priority wave is company-indexed metadata, not a public allowlist.
          // Remove excluded company identifiers without changing the canonical source.
          if (snapshot.company_second_depth?.priority_wave !== undefined) {
            if (!Array.isArray(snapshot.company_second_depth.priority_wave)) throw new Error('Invalid second-depth priority wave');
            const admittedIds = new Set(admitted.map(company => company.company_id));
            snapshot.company_second_depth.priority_wave = snapshot.company_second_depth.priority_wave.filter(id => admittedIds.has(id));
          }
          writeFileSync(path, JSON.stringify(snapshot, null, 2) + '\n');
          console.log('Deployable company records: ' + admitted.length + ' of ' + sourceCount);
          NODE

      - name: Reject unadmitted companies in deployable Helix JSON
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { admittedAtlasCompany } from './scripts/public-atlas-admission.mjs';
          const snapshot = JSON.parse(readFileSync('site-v15/data/helix-root.json', 'utf8'));
          if (!Array.isArray(snapshot.companies)) throw new Error('Public Helix companies array missing');
          const admittedIds = new Set(snapshot.companies.map(company => company.company_id));
          if (snapshot.companies.length === 0) {
            throw new Error('Public Helix JSON must contain at least one admitted company');
          }
          if (admittedIds.size !== snapshot.companies.length || admittedIds.has(undefined)) {
            throw new Error('Public Helix JSON has missing or duplicate company IDs');
          }
          for (const company of snapshot.companies) {
            if (typeof company.company_id !== 'string' || !company.company_id.trim()) {
              throw new Error('Public Helix JSON company ID must be a nonblank string');
            }
            if (!Array.isArray(company.repositories) || company.repositories.length === 0) {
              throw new Error('Public Helix JSON company has no admitted repositories');
            }
            for (const repo of company.repositories) {
              if (!repo || typeof repo !== 'object' || Array.isArray(repo) ||
                  repo.visibility !== 'public' || repo.inventory_scope !== 'HELIX_ADMITTED' ||
                  typeof repo.repository !== 'string' ||
                  !/^GlacierEQ\/[A-Za-z0-9_.-]+$/.test(repo.repository)) {
                throw new Error('Public Helix JSON contains an unadmitted repository');
              }
            }
          }
          const priorityWave = snapshot.company_second_depth?.priority_wave;
          if (priorityWave !== undefined && !Array.isArray(priorityWave)) {
            throw new Error('Public Helix JSON priority wave must be an array');
          }
          if (priorityWave?.some(id => typeof id !== 'string' || !id.trim() || !admittedIds.has(id))) {
            throw new Error('Public Helix JSON priority wave contains an invalid or excluded company ID');
          }
          if (priorityWave && new Set(priorityWave).size !== priorityWave.length) {
            throw new Error('Public Helix JSON priority wave contains duplicate company IDs');
          }
          const excluded = snapshot.companies.filter(company => !admittedAtlasCompany(company));
          if (excluded.length) {
            throw new Error(`Public Helix JSON contains ${excluded.length} unadmitted companies; publication blocked until a safe projection is generated`);
          }
          console.log(`Public Helix JSON admission verified: ${snapshot.companies.length} companies`);
          NODE

      - name: Revalidate final sanitized public site
        run: node site-v15/scripts/validate.mjs

      - name: Stage only deterministic validator and generated public projection
        run: |
          git add scripts/validate-helix-projection.mjs site-v15
          if ! git diff --quiet; then
            echo "Unexpected unstaged mutation outside validator + site-v15 projection:" >&2
            git status --short >&2
            exit 1
          fi

      - name: Open generated projection pull request when state changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "Projection already matches Helix $HELIX_ROOT_SHA"
            exit 0
          fi

          branch="automation/helix-effective-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Sync effective Helix projection ${HELIX_ROOT_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Sync effective Helix projection ${HELIX_ROOT_SHA:0:12}" \
            --body "Generated from exact canonical GlacierEQ/job-app-helix SHA \`${HELIX_ROOT_SHA}\` using the base + modular company second-depth compiler. The same run upgraded the stale stage-distribution validator, validated the public projection/receipt, rendered and validated Atlas + company constellation + estate intelligence, and passed the V17 site validator before opening this PR. No hand-edited company HTML or protected-main write is used."
