name: Create Mission Agentic AI Assurance Repo

on:
  push:
    branches:
      - ops/create-mission-agentic-ai-assurance
    paths:
      - .github/workflows/create-mission-agentic-ai-assurance.yml

permissions:
  contents: read

jobs:
  create-repository:
    runs-on: ubuntu-24.04
    steps:
      - name: Attempt account-level repository creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            -d '{"name":"mission-agentic-ai-assurance","description":"Independent mission AI assurance reference architecture and proof harness. No company affiliation implied.","private":false,"auto_init":true}')
          cat /tmp/response.json
          test "$code" = "201"
