name: Helix Portfolio Projection

on:
  pull_request:
    paths:
      - "portfolio-source.json"
      - "scripts/sync-helix-projection.mjs"
      - "scripts/reconcile-helix-company-cardinality.mjs"
      - "scripts/project-estate-intelligence.mjs"
      - "scripts/render-helix-atlas.mjs"
      - "scripts/render-company-constellation.mjs"
      - "scripts/link-helix-atlas.mjs"
      - "scripts/link-company-constellation.mjs"
      - "scripts/validate-helix-projection.mjs"
      - "scripts/validate-estate-intelligence.mjs"
      - "scripts/validate-helix-atlas.mjs"
      - "scripts/validate-company-constellation.mjs"
      - "scripts/harden-public-proof-surface.mjs"
      - "scripts/validate-public-proof-surface.mjs"
      - "site-v15/**"
      - "vercel.json"
      - ".github/workflows/helix-projection-sync.yml"
  push:
    branches: [main]
    paths:
      - "portfolio-source.json"
      - "scripts/sync-helix-projection.mjs"
      - "scripts/reconcile-helix-company-cardinality.mjs"
      - "scripts/project-estate-intelligence.mjs"
      - "scripts/render-helix-atlas.mjs"
      - "scripts/render-company-constellation.mjs"
      - "scripts/link-helix-atlas.mjs"
      - "scripts/link-company-constellation.mjs"
      - "scripts/validate-helix-projection.mjs"
      - "scripts/validate-estate-intelligence.mjs"
      - "scripts/validate-helix-atlas.mjs"
      - "scripts/validate-company-constellation.mjs"
      - "scripts/harden-public-proof-surface.mjs"
      - "scripts/validate-public-proof-surface.mjs"
      - "site-v15/**"
      - "vercel.json"
      - ".github/workflows/helix-projection-sync.yml"
  schedule:
    - cron: "47 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-portfolio-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-render-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact portal source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile public-safe Helix projection and receipt
        run: node scripts/sync-helix-projection.mjs
      - name: Reconcile downstream company cardinality to fresh Helix authority
        run: node scripts/reconcile-helix-company-cardinality.mjs
      - name: Validate public-safe projection and receipt
        run: node scripts/validate-helix-projection.mjs
      - name: Render Company Atlas and real company routes
        run: node scripts/render-helix-atlas.mjs
      - name: Link Atlas across public surfaces
        run: node scripts/link-helix-atlas.mjs
      - name: Validate generated Atlas, company routes, and links
        run: node scripts/validate-helix-atlas.mjs
      - name: Compile evidence-aware company constellation
        run: node scripts/render-company-constellation.mjs
      - name: Link company constellation across public surfaces
        run: node scripts/link-company-constellation.mjs
      - name: Validate company constellation and evidence boundaries
        run: node scripts/validate-company-constellation.mjs
      - name: Project source-bound estate intelligence
        run: node scripts/project-estate-intelligence.mjs
      - name: Validate estate-intelligence privacy and freshness boundaries
        run: node scripts/validate-estate-intelligence.mjs
      - name: Harden recruiter and machine proof surface
        run: node scripts/harden-public-proof-surface.mjs
      - name: Validate hardened proof routing and machine discovery
        run: node scripts/validate-public-proof-surface.mjs
      - name: Validate existing V17 hiring surface
        run: node site-v15/scripts/validate.mjs
      - name: Upload compiled projection, receipt, Atlas, intelligence, and company routes
        uses: actions/upload-artifact@v4
        with:
          name: helix-public-projection-${{ github.sha }}
          path: |
            site-v15/data/helix-root.json
            site-v15/data/helix-root.receipt.json
            site-v15/data/company-cardinality-reconciliation.json
            site-v15/data/estate-intelligence.json
            site-v15/data/company-atlas-summary.json
            site-v15/data/company-atlas.proto
            site-v15/data/resume.json
            site-v15/data/portfolio.json
            site-v15/atlas/**
            site-v15/companies/
          if-no-files-found: error
          retention-days: 30
