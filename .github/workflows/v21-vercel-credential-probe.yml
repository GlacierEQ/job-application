name: V21 Vercel Credential Probe

on:
  push:
    branches:
      - ops/v21-vercel-credential-probe
    paths:
      - .github/workflows/v21-vercel-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Report only credential presence
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ACCESS_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=present"
            else
              echo "${name}=absent"
            fi
          done
