name: APEX Atlas Reconciler Idempotence

on:
  push:
    branches:
      - apex/job-restore-atlas-runtime-20260816
    paths:
      - '.github/workflows/apex-atlas-reconciler-idempotence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apex/job-restore-atlas-runtime-20260816
      - name: Make scalability reconciliation accept already-scaled renderers
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/reconcile-helix-company-cardinality.mjs')
          text = path.read_text()
          old = '''function scaleAtlasRenderer(source) {
            let next = source;
            const guardPattern = /\\n  if \\(companies\\.length > \\d+\\) \\{\\n    throw new Error\\("constellation supports at most \\d+ governed company positions"\\);\\n  \\}\\n/;
            if (guardPattern.test(next)) next = next.replace(guardPattern, '\\n');
            const radiusPattern = /const radius = 21 \\+ r \\* 12; \\/\\/ 21%, 33%, 45%, 57%, \\.\\.\\./;
            if (!radiusPattern.test(next)) {
              throw new Error('render-helix-atlas.mjs: scalable constellation radius anchor missing');
            }
            next = next.replace(
              radiusPattern,
              'const radius = rings.length === 1 ? 31 : 16 + (31 * r) / (rings.length - 1);',
            );
            return { source: next, changed: next !== source };
          }'''.replace('          ', '')
          new = '''function scaleAtlasRenderer(source) {
            let next = source;
            const guardPattern = /\\n  if \\(companies\\.length > \\d+\\) \\{\\n    throw new Error\\("constellation supports at most \\d+ governed company positions"\\);\\n  \\}\\n/;
            const adaptiveRadiusPattern = /const radialStep = rings\\.length > 1 \\? 30 \\/ \\(rings\\.length - 1\\) : 0;\\n    const radius = 16 \\+ r \\* radialStep;/;
            const legacyRadiusPattern = /const radius = 21 \\+ r \\* 12; \\/\\/ 21%, 33%, 45%, 57%, \\.\\.\\./;

            // Reconciliation is allowed to remove an obsolete fixed-count guard, but it must
            // not punish a renderer that already implements bounded adaptive geometry.
            if (adaptiveRadiusPattern.test(next)) {
              return { source: next, changed: false };
            }
            if (guardPattern.test(next)) next = next.replace(guardPattern, '\\n');
            if (!legacyRadiusPattern.test(next)) {
              throw new Error('render-helix-atlas.mjs: neither adaptive nor legacy constellation radius contract found');
            }
            next = next.replace(
              legacyRadiusPattern,
              'const radialStep = rings.length > 1 ? 30 / (rings.length - 1) : 0;\\n    const radius = 16 + r * radialStep;',
            );
            return { source: next, changed: next !== source };
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('scaleAtlasRenderer donor block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Verify reconciler and renderer cooperate
        run: |
          node --check scripts/reconcile-helix-company-cardinality.mjs
          node --check scripts/render-helix-atlas.mjs
          node scripts/reconcile-helix-company-cardinality.mjs
          node scripts/render-helix-atlas.mjs
          node scripts/activate-atlas-runtime.mjs
          node scripts/validate-atlas-interaction.mjs
      - name: Commit idempotence repair
        run: |
          git config user.name 'casey'
          git config user.email 'GLACIER.EQUILIBRIUM@GMAIL.COM'
          git add scripts/reconcile-helix-company-cardinality.mjs site-v15/atlas/index.html site-v15/assets/helix-atlas.stars.css site-v15/companies || true
          if git diff --cached --quiet; then
            echo 'No tracked reconciliation delta beyond source patch.'
          else
            git commit -m 'restore: make Atlas scalability reconciliation idempotent'
            git push origin HEAD:apex/job-restore-atlas-runtime-20260816
          fi
