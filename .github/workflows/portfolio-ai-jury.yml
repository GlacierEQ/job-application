name: Portfolio AI Jury

on:
  push:
    branches:
      - audit/psysocx-hiring-system-2026-08-03
    paths:
      - .github/workflows/portfolio-ai-jury.yml

permissions:
  contents: read

jobs:
  blind-reader-batch:
    name: ${{ matrix.provider }} · 25 blind reads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            output: openai-batch.json
            capability_url: https://kjebemdgvjvuutzvhbtp.supabase.co/functions/v1/portfolio-ai-jury?cap=QIVwxduFrFCNMHDXpqE_PoZZd5AJJT7rgpnEy2pH4Wc
          - provider: anthropic
            output: anthropic-batch.json
            capability_url: https://kjebemdgvjvuutzvhbtp.supabase.co/functions/v1/portfolio-ai-jury?cap=55X9i6mmysnbc2jAOS34tPCww3N3YEa63GHCYc73dWQ
          - provider: google
            output: google-batch.json
            capability_url: https://kjebemdgvjvuutzvhbtp.supabase.co/functions/v1/portfolio-ai-jury?cap=fA4yOE0YSax-fOzSSuyIhZbocWkKgToWt-_EZ98PLtk
          - provider: xai
            output: xai-batch.json
            capability_url: https://kjebemdgvjvuutzvhbtp.supabase.co/functions/v1/portfolio-ai-jury?cap=42GTvKUoyfcCELHsJDSsUM6N7KwHmXr5YxinVq2_Q4s
    steps:
      - name: Invoke one-use capability
        env:
          JURY_URL: ${{ matrix.capability_url }}
          OUTPUT_FILE: ${{ matrix.output }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 420 \
            "$JURY_URL" \
            --output "$OUTPUT_FILE"
          python -m json.tool "$OUTPUT_FILE" > validated.json
          mv validated.json "$OUTPUT_FILE"

      - name: Upload provider receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ai-jury-${{ matrix.provider }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7
