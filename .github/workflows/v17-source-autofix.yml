name: One-shot V17 Source Autofix

on:
  push:
    branches:
      - release/v16-signal-architecture
    paths:
      - '.github/workflows/v17-source-autofix.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: v17-source-autofix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v16-signal-architecture
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact formatter
        run: python -m pip install --disable-pip-version-check ruff==0.16.1

      - name: Apply targeted lint fixes and formatting
        run: |
          ruff check --fix --unsafe-fixes \
            site-v15/scripts/build-resume-v17-deterministic.py \
            site-v15/scripts/generate-resume-v17.py
          ruff format \
            site-v15/scripts/build-resume-v17-deterministic.py \
            site-v15/scripts/generate-resume-v17.py
          ruff check \
            site-v15/scripts/build-resume-v17-deterministic.py \
            site-v15/scripts/generate-resume-v17.py
          ruff format --check \
            site-v15/scripts/build-resume-v17-deterministic.py \
            site-v15/scripts/generate-resume-v17.py

      - name: Remove temporary workflow and persist clean source
        run: |
          rm .github/workflows/v17-source-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site-v15/scripts/build-resume-v17-deterministic.py \
            site-v15/scripts/generate-resume-v17.py \
            .github/workflows/v17-source-autofix.yml
          git commit -m "Autofix V17 generator source"
          git push origin HEAD:release/v16-signal-architecture
