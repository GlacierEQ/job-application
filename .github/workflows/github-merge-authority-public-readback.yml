name: GitHub Merge Authority Public Readback

on:
  pull_request:
    paths:
      - "projects/github-merge-authority-proof/**"
      - "scripts/sync-helix-projection-effective.mjs"
      - "scripts/reconcile-helix-company-cardinality.mjs"
      - "scripts/render-helix-atlas.mjs"
      - "scripts/link-helix-atlas.mjs"
      - "scripts/validate-helix-projection.mjs"
      - "scripts/validate-helix-atlas.mjs"
      - "scripts/validate-github-merge-authority-path-policy.mjs"
      - "scripts/validate-github-merge-authority-public-readback.mjs"
      - "scripts/validate-github-merge-authority-public-readback-v2.mjs"
      - "site-v15/companies/github/**"
      - "site-v15/data/company-atlas-summary.json"
      - "vercel.json"
      - ".github/workflows/helix-projection-sync.yml"
      - ".github/workflows/github-merge-authority-public-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile effective Helix projection
        run: node scripts/sync-helix-projection-effective.mjs
      - name: Reconcile downstream company cardinality
        run: node scripts/reconcile-helix-company-cardinality.mjs
      - name: Validate effective projection and receipt
        run: node scripts/validate-helix-projection.mjs
      - name: Render GitHub company surface and Atlas
        run: node scripts/render-helix-atlas.mjs
      - name: Link Atlas across public surfaces
        run: node scripts/link-helix-atlas.mjs
      - name: Validate generated Atlas and company routes
        run: node scripts/validate-helix-atlas.mjs
      - name: Validate fixed Helix non-projection path policy
        run: node scripts/validate-github-merge-authority-path-policy.mjs
      - name: Validate GitHub EVOLVING production public readback
        run: node scripts/validate-github-merge-authority-public-readback-v2.mjs
