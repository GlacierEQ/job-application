name: APEX Proof Starmap Runtime Bootstrap

on:
  push:
    branches:
      - apex/restore-scalable-proof-starmap-20260817

permissions:
  contents: write

jobs:
  wire-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apex/restore-scalable-proof-starmap-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wire runtime into release router and sealed bundle
        shell: python
        run: |
          from pathlib import Path
          import json

          router_path = Path('deployment/vercel-source-bridge/api/release-router.js')
          router = router_path.read_text()
          require_line = "const inventionsProxy = require('./inventions-proxy.js');\n"
          if "require('./starmap-proxy.js')" not in router:
              router = router.replace(require_line, require_line + "const starmapProxy = require('./starmap-proxy.js');\n")
          atlas_policy = """  if (filePath === 'atlas/index.html') {\n    return {\n      kind: 'html',\n      canonical: `${PUBLIC_ORIGIN}/atlas/`,\n      robots: 'index,follow',\n    };\n  }\n"""
          starmap_policy = """\n  if (filePath === 'atlas/starmap/index.html') {\n    return {\n      kind: 'html',\n      canonical: `${PUBLIC_ORIGIN}/atlas/starmap/`,\n      robots: hasRouteSelectors(req) ? 'noindex,follow' : 'index,follow',\n    };\n  }\n"""
          if "filePath === 'atlas/starmap/index.html'" not in router:
              if atlas_policy not in router:
                  raise SystemExit('atlas SEO policy anchor missing')
              router = router.replace(atlas_policy, atlas_policy + starmap_policy)
          invention_handler = """  if (rawPath === '__inventions_verify' || inventionsProxy.handles(rawPath)) {\n    return inventionsProxy(req, res);\n  }\n"""
          starmap_handler = """  if (rawPath === '__starmap_verify' || starmapProxy.handles(rawPath)) {\n    return starmapProxy(req, res);\n  }\n"""
          if "starmapProxy.handles" not in router:
              if invention_handler not in router:
                  raise SystemExit('inventions handler anchor missing')
              router = router.replace(invention_handler, invention_handler + starmap_handler)
          router_path.write_text(router)

          bundle_path = Path('scripts/build-v25-deployment-bundle.mjs')
          bundle = bundle_path.read_text()
          module_anchor = "  'deployment/vercel-source-bridge/api/inventions-proxy.js',\n"
          if "api/starmap-proxy.js'" not in bundle:
              if module_anchor not in bundle:
                  raise SystemExit('bundle module anchor missing')
              bundle = bundle.replace(module_anchor, module_anchor + "  'deployment/vercel-source-bridge/api/starmap-proxy.js',\n")
          marker_anchor = """  if (!modules['api/inventions-proxy.js'].includes('V28-INVENTION-EVIDENCE-RUNTIME')) {\n    throw new Error('invention_evidence_runtime_release_marker_missing');\n  }\n"""
          marker = """  if (!modules['api/starmap-proxy.js'].includes('V30-PROOF-STARMAP-RUNTIME')) {\n    throw new Error('proof_starmap_runtime_release_marker_missing');\n  }\n"""
          if 'proof_starmap_runtime_release_marker_missing' not in bundle:
              if marker_anchor not in bundle:
                  raise SystemExit('bundle marker anchor missing')
              bundle = bundle.replace(marker_anchor, marker_anchor + marker)
          bundle_path.write_text(bundle)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test:starmap-runtime'] = 'node --test deployment/vercel-source-bridge/starmap-proxy.test.js'
          test_script = package['scripts']['test']
          test_file = 'deployment/vercel-source-bridge/starmap-proxy.test.js'
          if test_file not in test_script:
              anchor = 'deployment/vercel-source-bridge/inventions-proxy.test.js '
              if anchor not in test_script:
                  raise SystemExit('package test anchor missing')
              test_script = test_script.replace(anchor, anchor + test_file + ' ')
          package['scripts']['test'] = test_script
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          linker_path = Path('scripts/link-helix-atlas.mjs')
          linker = linker_path.read_text()
          sitemap_anchor = '    "https://casey-barton-glaciereq.vercel.app/atlas/",\n'
          if 'https://casey-barton-glaciereq.vercel.app/atlas/starmap/' not in linker:
              if sitemap_anchor not in linker:
                  raise SystemExit('sitemap anchor missing')
              linker = linker.replace(sitemap_anchor, sitemap_anchor + '    "https://casey-barton-glaciereq.vercel.app/atlas/starmap/",\n')
          linker_path.write_text(linker)
      - name: Run focused adversarial proof
        run: npm run test:starmap-runtime
      - name: Run complete native proof
        run: npm test
      - name: Build sealed production bundle
        run: |
          rm -rf /tmp/starmap-bundle
          node scripts/build-v25-deployment-bundle.mjs --source-commit "${GITHUB_SHA}" --output-dir /tmp/starmap-bundle
          grep -q 'V30-PROOF-STARMAP-RUNTIME' /tmp/starmap-bundle/api/index.js
      - name: Persist executable wiring and remove bootstrap
        run: |
          rm .github/workflows/apex-starmap-runtime-bootstrap.yml
          git config user.name "casey"
          git config user.email "GLACIER.EQUILIBRIUM@GMAIL.COM"
          git add deployment/vercel-source-bridge/api/release-router.js scripts/build-v25-deployment-bundle.mjs package.json scripts/link-helix-atlas.mjs .github/workflows/apex-starmap-runtime-bootstrap.yml
          git commit -m "feat: wire proof starmap into production release path"
          git push origin HEAD:apex/restore-scalable-proof-starmap-20260817
