name: V17 Generate Resume Artifacts

on:
  push:
    branches:
      - release/v17-resume-intelligence
    paths:
      - 'site-v15/scripts/generate-resume-v17.py'
      - '.github/workflows/v17-generate-resume-artifacts.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/v17-resume-intelligence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate governed PDF and DOCX
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.3 python-docx==1.2.0
          python site-v15/scripts/generate-resume-v17.py | tee /tmp/v17-resume-artifacts.json

      - name: Patch exact artifact identities into validators
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          manifest = json.loads(Path('site-v15/data/resume-artifacts.json').read_text())
          pdf_hash = manifest['artifacts']['pdf']['sha256']
          docx_hash = manifest['artifacts']['docx']['sha256']

          inherited = Path('site-v15/scripts/validate.mjs')
          text = inherited.read_text()
          text = re.sub(
              r"const allowedResumePdfs=new Set\(\[[^\]]+\]\);",
              "const allowedResumePdfs=new Set(['e4d189910b324555f63e8d4214d9f47be582c3e501fdb87136f712db443fad88','" + pdf_hash + "']);",
              text,
          )
          inherited.write_text(text)

          v17 = Path('site-v15/scripts/validate-resume-v17.mjs')
          text = v17.read_text()
          text = re.sub(r"assert\(sha256\(pdf\) === '[0-9a-f]{64}'", "assert(sha256(pdf) === '" + pdf_hash + "'", text)
          text = re.sub(r"assert\(sha256\(docx\) === '[0-9a-f]{64}'", "assert(sha256(docx) === '" + docx_hash + "'", text)
          v17.write_text(text)

          receipt = Path('deployment-receipts/V17_RESUME_INTELLIGENCE_CANDIDATE_2026-08-05.md')
          body = receipt.read_text()
          marker = '\n## Generated artifact identities\n'
          body = body.split(marker)[0].rstrip() + marker + f"\n- PDF SHA-256: `{pdf_hash}`\n- DOCX SHA-256: `{docx_hash}`\n- Generator: `site-v15/scripts/generate-resume-v17.py`\n"
          receipt.write_text(body)
          PY

      - name: Upload independent QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: v17-generated-resume-qa
          path: |
            site-v15/downloads/Casey_Barton_Resume.pdf
            site-v15/downloads/Casey_Barton_Resume.docx
            site-v15/data/resume-artifacts.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit exact generated artifacts and remove bootstrap
        run: |
          rm .github/workflows/v17-generate-resume-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            site-v15/downloads/Casey_Barton_Resume.pdf \
            site-v15/downloads/Casey_Barton_Resume.docx \
            site-v15/data/resume-artifacts.json \
            site-v15/scripts/validate.mjs \
            site-v15/scripts/validate-resume-v17.mjs \
            deployment-receipts/V17_RESUME_INTELLIGENCE_CANDIDATE_2026-08-05.md \
            .github/workflows/v17-generate-resume-artifacts.yml
          git commit -m 'Generate exact V17 resume artifacts with governed provenance'
          git push origin HEAD:release/v17-resume-intelligence
