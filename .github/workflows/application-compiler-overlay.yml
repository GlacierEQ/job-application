name: Application Compiler Overlay

on:
  push:
    branches: [main]
    paths:
      - "deployment/vercel-source-bridge/api/compiler-proxy.js"
      - "deployment/vercel-source-bridge/api/release-router.js"
      - "deployment/vercel-source-bridge/compiler-proxy.test.js"
      - "package.json"
      - ".github/workflows/application-compiler-overlay.yml"
  pull_request:
    paths:
      - "deployment/vercel-source-bridge/api/compiler-proxy.js"
      - "deployment/vercel-source-bridge/api/release-router.js"
      - "deployment/vercel-source-bridge/compiler-proxy.test.js"
      - "package.json"
      - ".github/workflows/application-compiler-overlay.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repository and presentation release gates
        run: npm test
      - name: Verify V25 production overlay modules compile
        run: |
          node --check deployment/vercel-source-bridge/api/compiler-proxy.js
          node --check deployment/vercel-source-bridge/api/release-router.js
      - name: Verify script-free compiler boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '<script\b|style=' deployment/vercel-source-bridge/api/compiler-proxy.js; then
            echo "Compiler source introduced a client-script or inline-style marker." >&2
            exit 1
          fi
