name: Evidence Review Confirmation Proof

on:
  pull_request:
    paths:
      - "tools/confirm_evidence_bound_review.py"
      - "tests/test_confirm_evidence_bound_review.py"
      - ".github/workflows/evidence-review-confirmation-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile runtime and tests
        run: python -m compileall -q tools/confirm_evidence_bound_review.py tests/test_confirm_evidence_bound_review.py
      - name: Run adversarial confirmation tests
        run: python -m unittest -v tests.test_confirm_evidence_bound_review
      - name: Exercise installed-style CLI surface
        run: python tools/confirm_evidence_bound_review.py --help >/dev/null
