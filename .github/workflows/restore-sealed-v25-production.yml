name: Restore Sealed V25 Production Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-sealed-v25-production.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact successful production build artifact
        uses: actions/download-artifact@v4
        with:
          name: v25-deployment-d2fbab4cff1a4374cb8f867c7a723e3d87181689
          path: /tmp/sealed-v25
          repository: GlacierEQ/job-application
          run-id: 31618347685
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify retained artifact against sealed production receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          sealed = pathlib.Path('/tmp/sealed-v25')
          receipt = json.loads((root / 'deployment-receipts/V23_SYSTEMS_ATLAS_PRODUCTION_2026-08-12.json').read_text())
          manifest = json.loads((sealed / 'deployment-manifest.json').read_text())
          runtime = receipt['runtime_bundle']
          assert manifest['source_commit'] == runtime['source_commit'], (manifest['source_commit'], runtime['source_commit'])
          assert manifest['module_count'] == runtime['module_count'], (manifest['module_count'], runtime['module_count'])
          assert manifest['factory_bundle']['sha256'] == runtime['factory_bundle_sha256']
          assert manifest['deployment_files'][0]['bytes'] == runtime['runtime_bytes']
          for item in manifest['deployment_files']:
              p = sealed / item['path']
              assert p.is_file(), p
              raw = p.read_bytes()
              assert len(raw) == item['bytes'], item['path']
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          assert manifest['verification_endpoint'] == runtime['verification_endpoint']
          print(json.dumps({
              'status': 'PASS',
              'source_commit': manifest['source_commit'],
              'module_count': manifest['module_count'],
              'factory_bundle_sha256': manifest['factory_bundle']['sha256'],
          }, sort_keys=True))
          PY
      - name: Restore exact sealed bytes into tracked production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/v25-deployment
          mkdir -p artifacts/v25-deployment
          cp -a /tmp/sealed-v25/. artifacts/v25-deployment/
          git diff --stat
      - name: Commit restored production artifact if repository projection drifted
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artifacts/v25-deployment; then
            echo 'Tracked artifact already matches sealed production.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/v25-deployment
          git commit -m 'repair: bind tracked V25 artifact to sealed production bytes'
          git push origin HEAD:main
