name: Applicant Submission Package Proof

on:
  push:
    branches: [main]
    paths:
      - "tools/compose_applicant_submission_package.py"
      - "tests/test_compose_applicant_submission_package.py"
      - ".github/workflows/applicant-submission-package-proof.yml"
  pull_request:
    paths:
      - "tools/compose_applicant_submission_package.py"
      - "tests/test_compose_applicant_submission_package.py"
      - ".github/workflows/applicant-submission-package-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile composed runtime
        run: |
          python -m py_compile \
            tools/compose_applicant_submission_package.py \
            tools/bind_applicant_direct_inputs.py \
            tools/confirm_evidence_bound_review.py \
            tools/greenhouse_semantic_answer_bridge.py
      - name: Run composition and bridge adversarial tests
        run: |
          python -m unittest \
            tests.test_compose_applicant_submission_package \
            tests.test_applicant_direct_input_binding \
            tests.test_confirm_evidence_bound_review
      - name: Exercise direct CLI
        run: python tools/compose_applicant_submission_package.py --help >/dev/null
