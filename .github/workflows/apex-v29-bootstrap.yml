name: APEX V29 Workflow Topology Bootstrap

on:
  push:
    branches:
      - apex/v29-workflow-topology-recovery-20260816
    paths:
      - '.github/workflows/apex-v29-bootstrap.yml'

permissions:
  contents: write

jobs:
  prove-and-bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind V29 runtime into self-contained compiler bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-v25-deployment-bundle.mjs')
          text = p.read_text()
          old = "  'deployment/vercel-source-bridge/api/inventions-proxy.js',\n  'deployment/vercel-source-bridge/api/release-router.js',"
          new = "  'deployment/vercel-source-bridge/api/inventions-proxy.js',\n  'deployment/vercel-source-bridge/api/workflow-topology-proxy.js',\n  'deployment/vercel-source-bridge/api/release-router.js',"
          if old not in text:
              raise SystemExit('v29_module_insertion_anchor_missing')
          text = text.replace(old, new, 1)
          old_check = "  if (!modules['api/inventions-proxy.js'].includes('V28-INVENTION-EVIDENCE-RUNTIME')) {\n    throw new Error('invention_evidence_runtime_release_marker_missing');\n  }"
          new_check = old_check + "\n  if (!modules['api/workflow-topology-proxy.js'].includes('V29-WORKFLOW-TOPOLOGY-RUNTIME')) {\n    throw new Error('workflow_topology_runtime_release_marker_missing');\n  }"
          if old_check not in text:
              raise SystemExit('v29_marker_insertion_anchor_missing')
          p.write_text(text.replace(old_check, new_check, 1))
          PY
      - name: Run focused adversarial proof
        run: npm run test:workflow-topology
      - name: Run native repository proof
        run: npm test
      - name: Prove self-contained deploy bundle contains V29
        run: |
          rm -rf /tmp/v29-bundle
          node scripts/build-v25-deployment-bundle.mjs --source-commit "$GITHUB_SHA" --output-dir /tmp/v29-bundle >/tmp/v29-manifest.json
          grep -q 'workflow-topology-proxy.js' /tmp/v29-manifest.json
          grep -q 'V29-WORKFLOW-TOPOLOGY-RUNTIME' /tmp/v29-bundle/api/index.js
          node --check /tmp/v29-bundle/api/index.js
      - name: Persist proven bundle binding
        run: |
          git config user.name 'GlacierEQ APEX'
          git config user.email 'glacier.equilibrium@gmail.com'
          git add scripts/build-v25-deployment-bundle.mjs
          git diff --cached --check
          git commit -m 'build(v29): include workflow topology in sealed runtime'
          git push origin HEAD:apex/v29-workflow-topology-recovery-20260816
