name: Materialize V21 Production Bridge

on:
  push:
    branches:
      - webdev/v21-first-star-production-bridge
    paths:
      - .github/workflows/materialize-v21-production-bridge.yml
      - scripts/_materialize_v21_bridge.py
      - scripts/_fix_v21_bridge_test.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webdev/v21-first-star-production-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch exact V21 bridge product files
        run: |
          python scripts/_materialize_v21_bridge.py
          python scripts/_fix_v21_bridge_test.py
      - name: Run bridge regression suite
        run: node --test deployment/vercel-source-bridge/proxy.test.js
      - name: Verify V21 against pinned live sources
        run: |
          node -e "const b=require('./deployment/vercel-source-bridge/api/proxy');let body=Buffer.alloc(0);const r={statusCode:200,setHeader(){},end(v=''){body=Buffer.isBuffer(v)?v:Buffer.from(String(v));}};b({url:'/api/proxy?path=__v21_verify'},r).then(()=>{const x=JSON.parse(body.toString());if(r.statusCode!==200||x.status!=='PASS'||x.schema!=='glaciereq.v21-production-verification.v1')throw new Error(body.toString());const l=x.lockheed_martin;if(x.second_depth.MAPPED_ONLY!==48||x.second_depth.CLAIM_PROMOTED!==1||!l||l.stage!=='CLAIM_PROMOTED'||l.ordinal!==7||l.gap_queue!==1||l.implementation_receipts!==1||l.proof_artifacts!==1||l.proof_verification_state!=='REPRODUCED'||l.claim_receipts!==1)throw new Error('V21 topology drift');console.log(JSON.stringify(x,null,2));}).catch(e=>{console.error(e);process.exit(1);});"
      - name: Commit exact V21 bridge
        run: |
          set -euo pipefail
          git config user.name casey
          git config user.email GLACIER.EQUILIBRIUM@GMAIL.COM
          git add deployment/vercel-source-bridge/api/proxy.js deployment/vercel-source-bridge/proxy.test.js
          git commit -m 'deploy: promote source bridge to V21 completed-star contract'
          git push origin HEAD:webdev/v21-first-star-production-bridge
