name: Materialize Lockheed First Star

on:
  push:
    branches:
      - webdev/lockheed-first-star-public
    paths:
      - ".github/workflows/materialize-lockheed-first-star.yml"
      - "scripts/sync-helix-projection.mjs"
      - "scripts/render-helix-atlas.mjs"
      - "scripts/render-company-constellation.mjs"
      - "scripts/link-helix-atlas.mjs"
      - "scripts/link-company-constellation.mjs"
      - "scripts/validate-helix-projection.mjs"
      - "scripts/validate-helix-atlas.mjs"
      - "scripts/validate-company-constellation.mjs"
      - "site-v15/data/HELIX_SYNC_REQUEST.json"

permissions:
  contents: write

concurrency:
  group: materialize-lockheed-first-star
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HELIX_ROOT_SHA: 87dd202abbff08ad2e7f6cf57739a8bdd661bd46
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: webdev/lockheed-first-star-public
          fetch-depth: 1
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile exact public projection
        run: node scripts/sync-helix-projection.mjs
      - name: Validate exact public projection
        run: node scripts/validate-helix-projection.mjs
      - name: Render Company Atlas
        run: node scripts/render-helix-atlas.mjs
      - name: Link Atlas
        run: node scripts/link-helix-atlas.mjs
      - name: Validate Atlas
        run: node scripts/validate-helix-atlas.mjs
      - name: Render company constellation
        run: node scripts/render-company-constellation.mjs
      - name: Link company constellation
        run: node scripts/link-company-constellation.mjs
      - name: Validate company constellation
        run: node scripts/validate-company-constellation.mjs
      - name: Validate existing hiring surface
        run: node site-v15/scripts/validate.mjs
      - name: Assert exact Helix source
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('site-v15/data/helix-root.json', 'utf8'));
          if (p.source.root_ref !== process.env.HELIX_ROOT_SHA) {
            throw new Error(`source drift: ${p.source.root_ref}`);
          }
          const lockheed = p.companies.find((c) => c.company_id === 'lockheed_martin');
          if (!lockheed || lockheed.second_depth.stage !== 'CODE_INSPECTED') {
            throw new Error('Lockheed stage did not materialize');
          }
          NODE
      - name: Commit generated projection to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-v15/data/helix-root.json \
            site-v15/data/helix-root.receipt.json \
            site-v15/data/company-atlas-summary.json \
            site-v15/data/company-atlas.proto \
            site-v15/atlas \
            site-v15/companies
          if git diff --cached --quiet; then
            echo "Projection already materialized."
            exit 0
          fi
          git commit -m "materialize(public): project Lockheed CODE_INSPECTED"
          git push origin HEAD:webdev/lockheed-first-star-public
