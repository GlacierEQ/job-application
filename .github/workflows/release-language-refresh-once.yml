name: One-shot V18 release language synthesis

on:
  push:
    branches:
      - synthesize/v18-release-language-current-main-20260807

permissions:
  contents: write

concurrency:
  group: v18-release-language-refresh-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthesize:
    if: github.ref == 'refs/heads/synthesize/v18-release-language-current-main-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact synthesis branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: synthesize/v18-release-language-current-main-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact bounded release-language repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-language-refresh-once.yml
          python - <<'PY'
          from pathlib import Path

          index = Path('site-v15/index.html')
          old = 'V16 signal architecture &#183; verified facts online'
          new = 'V16 + V17 production &#183; verified facts online'
          text = index.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old release label, found {text.count(old)}')
          index.write_text(text.replace(old, new), encoding='utf-8')

          validator = Path('site-v15/scripts/validate.mjs')
          vtext = validator.read_text(encoding='utf-8')
          assertion = "assert(recruiter.includes('V16 + V17 production &#183; verified facts online'), 'recruiter release language drift');"
          anchor = "assert(!recruiter.includes('&#250493;'), 'recruiter contains corrupted footer text');"
          if assertion not in vtext:
              if vtext.count(anchor) != 1:
                  raise SystemExit('validator anchor drift')
              vtext = vtext.replace(anchor, anchor + '\n' + assertion)
          validator.write_text(vtext, encoding='utf-8')
          PY

      - name: Verify recruiter release contract
        shell: bash
        run: |
          set -euo pipefail
          node site-v15/scripts/validate.mjs
          git diff --check
          grep -F 'V16 + V17 production &#183; verified facts online' site-v15/index.html
          grep -F "recruiter release language drift" site-v15/scripts/validate.mjs

      - name: Commit exact synthesis and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align recruiter release language with V16 + V17 production'
          git push origin HEAD:synthesize/v18-release-language-current-main-20260807
