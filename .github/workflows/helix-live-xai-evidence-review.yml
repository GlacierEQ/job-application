name: Helix Live xAI Evidence Review

on:
  pull_request:
    paths:
      - "RESUME_ATS.md"
      - "site-v15/data/resume.json"
      - "scripts/export_helix_candidate_profile.py"
      - "scripts/build_evidence_bound_application_review.py"
      - "tests/test_evidence_bound_application_review.py"
      - "targets/spacexai/**"
      - ".github/workflows/helix-live-xai-evidence-review.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HELIX_SHA: 725e785453ab01350d7b273c94ddb4dac70501af
  XAI_EVIDENCE: .helix-runtime/docs/evidence-constellations/xai-spacex-2026-08-18/constellations/xai.md

jobs:
  live-evidence-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hiring repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out exact Helix runtime and reviewed evidence
        uses: actions/checkout@v6
        with:
          repository: GlacierEQ/job-app-helix
          ref: ${{ env.HELIX_SHA }}
          path: .helix-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Helix runtime and test dependencies
        run: |
          python -m pip install -e ./.helix-runtime
          python -m pip install pytest ruff

      - name: Prove evidence-review engine adversarially
        run: |
          ruff check scripts/build_evidence_bound_application_review.py tests/test_evidence_bound_application_review.py
          ruff format --check scripts/build_evidence_bound_application_review.py tests/test_evidence_bound_application_review.py
          pytest -q tests/test_evidence_bound_application_review.py
          python scripts/build_evidence_bound_application_review.py --help

      - name: Export maintained production CandidateProfile
        run: |
          mkdir -p helix-live/state helix-live/packets
          python scripts/export_helix_candidate_profile.py \
            --source site-v15/data/resume.json \
            --output helix-live/state/COMPILED_CANDIDATE_PROFILE.json
          python scripts/export_helix_candidate_profile.py \
            --source site-v15/data/resume.json \
            --output helix-live/state/COMPILED_CANDIDATE_PROFILE.json \
            --check

      - name: Execute maintained profile against live xAI inventory
        run: |
          job-app-helix-target-application \
            --manifest targets/spacexai/target_manifest.json \
            --profile helix-live/state/COMPILED_CANDIDATE_PROFILE.json \
            --state-dir helix-live/state \
            --output-dir helix-live/packets \
            --database helix-live/applications.sqlite \
            --limit 4 \
            > helix-live/target-application-output.json

      - name: Prepare live Greenhouse fields with source-reviewed portfolio evidence
        run: |
          test -f "$XAI_EVIDENCE"
          JOB_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("helix-live/state/APPLICATION_READY_TARGET.json").read_text())
          print(release["selected"]["opening_id"])
          PY
          )"
          job-app-helix-greenhouse-prepare \
            --release helix-live/state/APPLICATION_READY_TARGET.json \
            --profile helix-live/state/COMPILED_CANDIDATE_PROFILE.json \
            --board-key xai \
            --job-id "$JOB_ID" \
            --evidence-source "$XAI_EVIDENCE" \
            --output helix-live/greenhouse-evidence-preparation.json \
            > helix-live/greenhouse-evidence-preparation-output.json

      - name: Build provenance-diverse exceptional-work review
        run: |
          python scripts/build_evidence_bound_application_review.py \
            --preparation helix-live/greenhouse-evidence-preparation.json \
            --output helix-live/exceptional-work-review.json \
            > helix-live/exceptional-work-review-output.json

      - name: Prove live evidence-bound review integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          evidence_path = Path(".helix-runtime/docs/evidence-constellations/xai-spacex-2026-08-18/constellations/xai.md")
          preparation_path = Path("helix-live/greenhouse-evidence-preparation.json")
          review_path = Path("helix-live/exceptional-work-review.json")
          preparation = json.loads(preparation_path.read_text(encoding="utf-8"))
          review = json.loads(review_path.read_text(encoding="utf-8"))

          assert review["schema"] == "glaciereq.evidence-bound-application-review.v1"
          assert review["status"] == "DRAFT_REVIEW_REQUIRED"
          assert review["application_id"] == preparation["application_id"]
          assert review["opening_id"] == preparation["opening_id"]
          assert review["preparation_sha256"] == hashlib.sha256(preparation_path.read_bytes()).hexdigest()
          assert review["review_policy"]["applicant_confirmation_required"] is True
          assert review["review_policy"]["external_submission_performed"] is False

          selected = review["evidence"]
          classes = {item["evidence_class"] for item in selected}
          assert "candidate_achievement" in classes or "candidate_experience" in classes
          assert "source_reviewed_portfolio_claim" in classes
          reviewed = [item for item in selected if item["evidence_class"] == "source_reviewed_portfolio_claim"]
          assert len(reviewed) >= 1
          evidence_sha = hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          assert all(item["source_sha256"] == evidence_sha for item in reviewed)
          assert all("xai.md:L" in item["provenance"] for item in reviewed)
          assert "xAI affiliation" not in review["draft"]
          assert "deployed at xAI" not in review["draft"]

          print(json.dumps({
              "application_id": review["application_id"],
              "opening_id": review["opening_id"],
              "field_name": review["field_name"],
              "selected_evidence_classes": sorted(classes),
              "selected_provenance": [item["provenance"] for item in selected],
              "evidence_source_sha256": evidence_sha,
              "preparation_sha256": review["preparation_sha256"],
              "review_receipt_sha256": review["receipt_sha256"],
              "helix_sha": "725e785453ab01350d7b273c94ddb4dac70501af"
          }, indent=2, sort_keys=True))
          PY

      - name: Upload live evidence-review package
        uses: actions/upload-artifact@v4
        with:
          name: helix-live-xai-evidence-review
          path: |
            helix-live/state/
            helix-live/packets/
            helix-live/target-application-output.json
            helix-live/greenhouse-evidence-preparation.json
            helix-live/greenhouse-evidence-preparation-output.json
            helix-live/exceptional-work-review.json
            helix-live/exceptional-work-review-output.json
          if-no-files-found: error
