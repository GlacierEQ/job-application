name: Fix V20 Review Findings

on:
  push:
    branches:
      - webdev/v20-first-star-production-bridge
    paths:
      - ".github/workflows/fix-v20-review.yml"

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: webdev/v20-first-star-production-bridge
          fetch-depth: 1
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply review fixes
        run: python3 scripts/_fix_v20_review.py
      - name: Run bridge suite
        run: node --test deployment/vercel-source-bridge/proxy.test.js
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/vercel-source-bridge/api/proxy.js deployment/vercel-source-bridge/proxy.test.js
          git diff --cached --check
          git commit -m "fix(v20): keep compiler generic and verifier versioned"
          git push origin HEAD:webdev/v20-first-star-production-bridge
