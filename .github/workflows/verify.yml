name: verify-portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate showcase
        run: python3 generate_showcase.py

      - name: Run portfolio tests
        run: python3 test_showcase.py

      - name: Confirm generated showcase is committed
        run: git diff --exit-code -- SHOWCASE.md
