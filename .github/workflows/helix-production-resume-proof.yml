name: Helix Production Resume Proof

on:
  pull_request:
    paths:
      - "RESUME_ATS.md"
      - ".github/workflows/helix-production-resume-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-production-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hiring repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out exact Helix runtime
        uses: actions/checkout@v6
        with:
          repository: GlacierEQ/job-app-helix
          ref: 4fa39c0d3cfbf413b1cda69fe2dbbd63761d18d7
          path: .helix-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Helix runtime
        run: python -m pip install -e ./.helix-runtime

      - name: Compile real recruiter resume through Helix
        run: |
          mkdir -p .helix-proof
          job-app-helix-profile \
            --resume RESUME_ATS.md \
            --profile-id casey-production \
            --output .helix-proof/CANDIDATE_PROFILE.json \
            > .helix-proof/compiler-output.json

      - name: Verify production profile invariants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          resume = Path("RESUME_ATS.md")
          profile_path = Path(".helix-proof/CANDIDATE_PROFILE.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          expected_hash = hashlib.sha256(resume.read_bytes()).hexdigest()

          assert profile["profile_id"] == "casey-production"
          assert profile["name"].casefold() == "casey del carpio barton"
          assert profile["summary"]
          assert "Python" in profile["skills"]
          assert profile["experience"]
          assert profile["provenance"]["policy"] == "source_text_only_no_claim_invention"
          assert profile["provenance"]["sources"][0]["sha256"] == expected_hash
          print(json.dumps({
              "profile_id": profile["profile_id"],
              "skills": len(profile["skills"]),
              "experience": len(profile["experience"]),
              "achievements": len(profile["achievements"]),
              "resume_sha256": expected_hash,
              "helix_sha": "4fa39c0d3cfbf413b1cda69fe2dbbd63761d18d7",
          }, indent=2, sort_keys=True))
          PY

      - name: Upload compiled production profile proof
        uses: actions/upload-artifact@v4
        with:
          name: helix-production-candidate-profile
          path: .helix-proof/
          if-no-files-found: error
