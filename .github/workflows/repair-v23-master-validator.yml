name: Repair V23 Master Validator Assertion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v23-master-validator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Bind validator to actual current master evidence policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('site-v15/scripts/validate.mjs')
          text = path.read_text()
          old = "assert(master.includes('Owning repositories retain evidence authority') || master.includes('Proof stays with the owning system'), 'master evidence policy missing');"
          new = "assert(master.includes('The owning system keeps the proof.') && master.includes('Current heads do not inherit historical test receipts.'), 'master evidence policy missing');"
          if old not in text:
              raise SystemExit('expected stale validator assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/repair-v23-master-validator.yml
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v15/scripts/validate.mjs .github/workflows/repair-v23-master-validator.yml
          git commit -m 'fix: bind master validator to actual V23 evidence policy'
          git push origin HEAD:main
