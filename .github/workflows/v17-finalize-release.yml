name: Finalize V17 Resume Release

on:
  push:
    branches:
      - release/v16-signal-architecture
    paths:
      - '.github/workflows/v17-finalize-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: v17-resume-native-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@v4
        with:
          ref: release/v16-signal-architecture
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic document generators
        run: python -m pip install --disable-pip-version-check reportlab==4.4.3 python-docx==1.2.0

      - name: Generate exact V17 artifacts natively
        run: python site-v15/scripts/build-resume-v17-deterministic.py

      - name: Validate V16 factual invariance
        run: node site-v15/scripts/validate.mjs

      - name: Validate V17 resume intelligence
        run: node site-v15/scripts/validate-resume-v17.mjs > /tmp/v17-validation.json

      - name: Verify validation receipt
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/v17-validation.json', 'utf8'));
          if (receipt.status !== 'PASS' || receipt.facts_invariant !== true) {
            throw new Error('V17 validation receipt contract failed');
          }
          console.log(JSON.stringify({
            status: receipt.status,
            schema: receipt.schema,
            facts_invariant: receipt.facts_invariant,
            files: receipt.files
          }, null, 2));
          NODE

      - name: Persist exact generated bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site-v15/downloads/Casey_Barton_Resume.pdf \
            site-v15/downloads/Casey_Barton_Resume.docx \
            site-v15/data/resume-artifacts.json
          if git diff --cached --quiet; then
            echo "Exact V17 artifacts already committed."
          else
            git commit -m "Finalize exact V17 resume artifacts"
            git push origin HEAD:release/v16-signal-architecture
          fi
