name: Finalize V17 Resume Release

on:
  push:
    branches:
      - release/v16-signal-architecture
    paths:
      - '.github/workflows/v17-finalize-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release branch with bootstrap source
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Recover and verify reviewed V17 source bundle
        env:
          V17_BUNDLE_SHA256: 7dc01509b0938b254109a273a51b727af32b9d63de62fe8e79d37ac36587bddf
          BOOTSTRAP_COMMIT: 976d579323a98295aaf92527f0792b74d89b9732
        run: |
          git show "$BOOTSTRAP_COMMIT":.github/workflows/v17-finalize-release.yml > /tmp/v17-bootstrap.yml
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('/tmp/v17-bootstrap.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/v17-text-bundle.b64 <<'BUNDLE'\n"
          if marker not in source:
              raise SystemExit('bootstrap bundle marker missing')

          tail = source.split(marker, 1)[1]
          candidates = re.findall(r'[A-Za-z0-9+/=]{1000,}', tail)
          if not candidates:
              raise SystemExit('no base64 payload candidate found')

          encoded = max(candidates, key=len)
          print({
              'candidate_count': len(candidates),
              'encoded_length': len(encoded),
              'prefix': encoded[:24],
              'suffix': encoded[-24:],
          })
          Path('/tmp/v17-text-bundle.tar.gz').write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY
          echo "$V17_BUNDLE_SHA256  /tmp/v17-text-bundle.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/v17-text-bundle.tar.gz -C .

      - name: Install visual document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
          python -m pip install --disable-pip-version-check python-docx==1.2.0 pypdf==5.9.0

      - name: Generate deterministic executive artifacts
        run: python site-v15/scripts/build-resume-v17-deterministic.py

      - name: Validate V16 and V17 contracts
        run: |
          node site-v15/scripts/validate.mjs
          node site-v15/scripts/validate-resume-v17.mjs > /tmp/v17-validation.json
          node - <<'NODE'
          const receipt = require('/tmp/v17-validation.json');
          if (receipt.status !== 'PASS' || receipt.facts_invariant !== true) {
            throw new Error('V17 validation contract failed');
          }
          NODE

      - name: Persist finalized V17 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site-v15/scripts/generate-resume-v17.py \
            site-v15/scripts/build-resume-v17-deterministic.py \
            site-v15/resume/ats.txt \
            site-v15/data/resume.json \
            site-v15/data/resume-artifacts.json \
            site-v15/downloads/Casey_Barton_Resume.pdf \
            site-v15/downloads/Casey_Barton_Resume.docx \
            site-v15/machine/index.html \
            RESUME_ATS.md \
            .github/workflows/v17-resume-intelligence.yml \
            deployment-receipts/V17_RESUME_INTELLIGENCE_FINAL_2026-08-05.md
          if git diff --cached --quiet; then
            echo "V17 release already materialized."
          else
            git commit -m "Finalize elite V17 resume intelligence"
            git push origin HEAD:release/v16-signal-architecture
          fi
