name: Finalize V17 Resume Release

on:
  push:
    branches:
      - release/v16-signal-architecture
    paths:
      - '.github/workflows/v17-finalize-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed V17 source bundle
        env:
          V17_BUNDLE_SHA256: 7dc01509b0938b254109a273a51b727af32b9d63de62fe8e79d37ac36587bddf
        run: |
          cat > /tmp/v17-text-bundle.b64 <<'BUNDLE'
[... ELLIPSIZATION ...]
BUNDLE
          base64 --decode /tmp/v17-text-bundle.b64 > /tmp/v17-text-bundle.tar.gz
          echo "$V17_BUNDLE_SHA256  /tmp/v17-text-bundle.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/v17-text-bundle.tar.gz -C .
      - name: Install visual document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
          python -m pip install --disable-pip-version-check python-docx==1.2.0 pypdf==5.9.0
      - name: Generate deterministic executive artifacts
        run: python site-v15/scripts/build-resume-v17-deterministic.py
      - name: Validate V16 and V17 contracts
        run: |
          node site-v15/scripts/validate.mjs
          node site-v15/scripts/validate-resume-v17.mjs > /tmp/v17-validation.json
          node -e "const r=require('/tmp/v17-validation.json'); if(r.status!=='PASS'||r.facts_invariant!==true) process.exit(1)"
      - name: Persist finalized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             site-v15/scripts/generate-resume-v17.py             site-v15/scripts/build-resume-v17-deterministic.py             site-v15/resume/ats.txt             site-v15/data/resume.json             site-v15/data/resume-artifacts.json             site-v15/downloads/Casey_Barton_Resume.pdf             site-v15/downloads/Casey_Barton_Resume.docx             site-v15/machine/index.html             RESUME_ATS.md             .github/workflows/v17-resume-intelligence.yml             deployment-receipts/V17_RESUME_INTELLIGENCE_FINAL_2026-08-05.md
          if git diff --cached --quiet; then
            echo "V17 release already materialized."
          else
            git commit -m "Finalize elite V17 resume intelligence"
            git push origin HEAD:release/v16-signal-architecture
          fi
