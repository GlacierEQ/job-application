name: APEX Workflow Topology Restoration Proof

on:
  pull_request:
    paths:
      - 'deployment/vercel-source-bridge/api/workflow-topology-proxy.js'
      - 'deployment/vercel-source-bridge/workflow-topology-proxy.test.js'
      - '.github/workflows/apex-workflow-topology-restoration.yml'
  push:
    branches:
      - apex/restore-workflow-topology-20260819
    paths:
      - 'deployment/vercel-source-bridge/api/workflow-topology-proxy.js'
      - 'deployment/vercel-source-bridge/workflow-topology-proxy.test.js'
      - '.github/workflows/apex-workflow-topology-restoration.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse restored runtime
        run: node --check deployment/vercel-source-bridge/api/workflow-topology-proxy.js
      - name: Run adversarial topology tests
        run: node --test deployment/vercel-source-bridge/workflow-topology-proxy.test.js
      - name: Execute real immutable-source verifier
        run: |
          node <<'NODE'
          const handler = require('./deployment/vercel-source-bridge/api/workflow-topology-proxy.js');
          const headers = new Map();
          const res = {
            statusCode: 200,
            setHeader(name, value) { headers.set(String(name).toLowerCase(), value); },
            getHeader(name) { return headers.get(String(name).toLowerCase()); },
            end(chunk = '') { this.body = Buffer.isBuffer(chunk) ? chunk : Buffer.from(String(chunk)); },
          };
          handler({ url: '/__workflow_topology_verify' }, res).then(() => {
            if (res.statusCode !== 200) throw new Error(`verifier_http_${res.statusCode}`);
            const receipt = JSON.parse(res.body.toString('utf8'));
            if (receipt.status !== 'PASS') throw new Error(`verifier_status_${receipt.status}`);
            if (receipt.public_contract?.scripts !== 0) throw new Error('public_contract_scripts_not_zero');
            if (!receipt.public_contract?.machine_json) throw new Error('machine_json_not_proven');
            if (!/^[a-f0-9]{64}$/.test(receipt.receipt_sha256 || '')) throw new Error('receipt_missing');
            console.log(JSON.stringify({status: receipt.status, receipt_sha256: receipt.receipt_sha256, source: receipt.source, public_contract: receipt.public_contract}, null, 2));
          }).catch((error) => { console.error(error); process.exit(1); });
          NODE
