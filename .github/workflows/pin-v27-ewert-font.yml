name: Pin V27 Ewert Font Bytes

on:
  push:
    branches:
      - design/algerian-monument-v27-20260810
    paths:
      - .github/workflows/pin-v27-ewert-font.yml
      - deployment/vercel-source-bridge/monument-title-proxy.test.js

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/algerian-monument-v27-20260810
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch, validate, pin, and test Ewert bytes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            'https://cdn.jsdelivr.net/fontsource/fonts/ewert@5.3.0/latin-400-normal.woff2' \
            --output /tmp/ewert.woff2
          test "$(head -c 4 /tmp/ewert.woff2)" = 'wOF2'
          SIZE="$(wc -c < /tmp/ewert.woff2 | tr -d ' ')"
          test "$SIZE" -gt 1024
          test "$SIZE" -le 131072
          DIGEST="$(sha256sum /tmp/ewert.woff2 | awk '{print $1}')"
          python3 - "$DIGEST" <<'PY'
          from pathlib import Path
          import sys
          path = Path('deployment/vercel-source-bridge/api/monument-title-proxy.js')
          text = path.read_text(encoding='utf-8')
          marker = '__PIN_EWERT_SHA256__'
          digest = sys.argv[1]
          if marker not in text:
              raise SystemExit('V27 digest marker missing')
          path.write_text(text.replace(marker, digest, 1), encoding='utf-8')
          PY
          npm test
          git diff --check
          echo "Pinned Ewert SHA-256: $DIGEST"
      - name: Commit exact byte pin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/vercel-source-bridge/api/monument-title-proxy.js
          git commit -m 'Pin exact V27 Ewert font bytes'
          git push origin HEAD:design/algerian-monument-v27-20260810
