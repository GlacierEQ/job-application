name: Patch Emerald Motion Master

on:
  push:
    branches:
      - design/emerald-motion-master-20260808
    paths:
      - .github/workflows/patch-emerald-motion-master.yml

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/emerald-motion-master-20260808
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded emerald presentation patch
        run: python3 scripts/patch-emerald-master.py
      - name: Verify focused compiler contract
        run: |
          node --check deployment/vercel-source-bridge/api/compiler-proxy.js
          node --test deployment/vercel-source-bridge/compiler-proxy.test.js
          git diff --check
      - name: Verify full presentation and deployment bundle
        run: |
          npm test
          node scripts/build-v25-deployment-bundle.mjs --source-commit "$GITHUB_SHA" --output-dir /tmp/v25-emerald
          test -s /tmp/v25-emerald/api/index.js
          test -s /tmp/v25-emerald/vercel.json
          test -s /tmp/v25-emerald/deployment-manifest.json
          node --check /tmp/v25-emerald/api/index.js
      - name: Commit verified presentation delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/vercel-source-bridge/api/compiler-proxy.js deployment/vercel-source-bridge/compiler-proxy.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore emerald motion to Master technical surfaces'
          git push origin HEAD:design/emerald-motion-master-20260808
