name: APEX Public Recruiter Role Matrix Proof

on:
  pull_request:
    paths:
      - 'deployment/vercel-source-bridge/api/recruiter-role-matrix.js'
      - 'deployment/vercel-source-bridge/recruiter-role-matrix.test.js'
      - 'deployment/vercel-source-bridge/vercel.json'
      - 'package.json'
      - '.github/workflows/apex-public-recruiter-role-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile runtime
        run: |
          node --check deployment/vercel-source-bridge/api/recruiter-role-matrix.js
          node --check deployment/vercel-source-bridge/recruiter-role-matrix.test.js
      - name: Prove matrix parity and fail-closed behavior
        run: node --test deployment/vercel-source-bridge/recruiter-role-matrix.test.js deployment/vercel-source-bridge/workflow-recruiter-proxy.test.js
      - name: Prove repository strict surface
        run: npm test
