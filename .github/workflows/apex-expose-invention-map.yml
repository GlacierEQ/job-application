name: APEX Expose Invention Map

on:
  push:
    branches:
      - apex/expose-invention-map-20260816

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply compressed recruiter surface
        run: node scripts/compress-recruiter-surface.mjs

      - name: Verify recruiter surface is stable
        run: node scripts/compress-recruiter-surface.mjs --check

      - name: Prove restored discovery route
        run: |
          grep -F 'href="/inventions/">Inventions</a>' site-v15/index.html
          test -f site-v15/inventions/index.html
          grep -F 'CROSS-REPOSITORY WORKFLOW TOPOLOGY' site-v15/inventions/index.html

      - name: Persist recruiter surface
        run: |
          changes="$(git status --porcelain -- site-v15/index.html)"
          if [ -z "$changes" ]; then
            echo 'recruiter surface already current'
            exit 0
          fi
          git config user.name 'GlacierEQ APEX'
          git config user.email 'glacier.equilibrium@gmail.com'
          git add site-v15/index.html
          git diff --cached --exit-code && {
            echo 'expected recruiter surface delta but index is empty' >&2
            exit 1
          }
          git commit -m 'build(recruiter): expose invention evidence map'
          git push origin HEAD:apex/expose-invention-map-20260816
