name: V21 Bridge Bundle Probe

on:
  push:
    branches:
      - ops/v21-vercel-credential-probe
    paths:
      - .github/workflows/v21-bridge-bundle-probe.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d8c84f3032570b70033b6036ad528d94bb6837bb
      - name: Emit deterministic compressed canonical bridge
        run: |
          set -euo pipefail
          file=deployment/vercel-source-bridge/api/proxy.js
          echo "BRIDGE_SHA256=$(sha256sum "$file" | awk '{print $1}')"
          echo "BRIDGE_BYTES=$(wc -c < "$file" | tr -d ' ')"
          gzip -n -9 -c "$file" > /tmp/proxy.js.gz
          echo "GZIP_BYTES=$(wc -c < /tmp/proxy.js.gz | tr -d ' ')"
          echo 'BUNDLE_BEGIN'
          base64 -w0 /tmp/proxy.js.gz
          echo
          echo 'BUNDLE_END'
