name: Finalize Mission Assurance Proof

on:
  push:
    branches:
      - webdev/v21-mission-agentic-ai-assurance
    paths:
      - ".github/workflows/finalize-mission-assurance-proof.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webdev/v21-mission-agentic-ai-assurance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format, reproduce, and bind proof
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff
          ruff check --fix --unsafe-fixes projects/mission-agentic-ai-assurance
          ruff format projects/mission-agentic-ai-assurance
          cd projects/mission-agentic-ai-assurance
          export PYTHONPATH=src
          python scripts/demo.py > proof/reproduced_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('proof/reproduced_receipt.json').read_text())
          expected = 'b7a3e3cba968e19bb91ed8f6881b69e37efc97d7e8414be0aca431dff501123f'
          if receipt['receipt_id'] != expected:
              raise SystemExit(f'unexpected reproduced receipt id: {receipt["receipt_id"]}')
          claim_path = Path('proof/claim_receipt.json')
          claim = json.loads(claim_path.read_text())
          claim['proof_receipt_id'] = receipt['receipt_id']
          claim['acceptance_tests'] = 17
          claim_path.write_text(json.dumps(claim, indent=2, sort_keys=True) + '\n')
          PY
          ruff format .
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          governed = [
              '.github/workflows/ci.yml',
              'MASTER.md',
              'MESH.yaml',
              'README.md',
              'buf.yaml',
              'evidence/problem_trusted_agentic_ai_integration.json',
              'evidence/role_734997br.json',
              'examples/lockheed_public_lens.json',
              'glaciereq/mission_assurance/v1/contract.proto',
              'machine/INTEGRATION.md',
              'machine/remedy.json',
              'proof/claim_receipt.json',
              'proof/implementation_receipt.json',
              'proof/reproduced_receipt.json',
              'pyproject.toml',
              'scripts/demo.py',
              'scripts/verify_proof.py',
              'src/mission_assurance/__init__.py',
              'src/mission_assurance/core.py',
              'tests/test_assurance.py',
          ]
          root = Path('.')
          manifest = {
              'credentials_required': False,
              'external_model_required': False,
              'governed_files': {
                  relative: sha256((root / relative).read_bytes()).hexdigest()
                  for relative in governed
              },
              'network_required': False,
              'reproduced_receipt_id': 'b7a3e3cba968e19bb91ed8f6881b69e37efc97d7e8414be0aca431dff501123f',
              'schema': 'glaciereq.mission-assurance-proof-manifest.v1',
              'test_count': 17,
          }
          Path('proof/proof_manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          python -m unittest discover -s tests -v
          python scripts/verify_proof.py
          ruff check .
          ruff format --check .
      - name: Commit proof-bound result
        run: |
          set -euo pipefail
          git config user.name casey
          git config user.email GLACIER.EQUILIBRIUM@GMAIL.COM
          git add projects/mission-agentic-ai-assurance
          if git diff --cached --quiet; then
            echo 'No finalization changes required.'
            exit 0
          fi
          git commit -m 'fix: bind hardened mission assurance proof'
          git push origin HEAD:webdev/v21-mission-agentic-ai-assurance
