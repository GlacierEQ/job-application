name: Helix Runtime Integrity

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/helix-effective-trigger-20260809.txt"
      - "targets/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - "APEX_BLUEPRINT_V1_JOB_RESTORE.md"
      - "build.sh"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HELIX_SAFE_SHA: ae900b5f2663a3be9e2f4b4e9d428ff01413763a
  RETIRED_HELIX_SHA_A: 725e785453ab01350d7b
  RETIRED_HELIX_SHA_B: 273c94ddb4dac70501af

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hiring repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Reject retired Helix runtime pins in executable workflow state
        shell: bash
        run: |
          set -euo pipefail
          retired="${RETIRED_HELIX_SHA_A}${RETIRED_HELIX_SHA_B}"
          if grep -R --line-number --fixed-strings "$retired" .github/workflows; then
            echo "retired Helix runtime pin reintroduced" >&2
            exit 1
          fi

      - name: Reject retired submission and self-heal resurrection surfaces
        shell: bash
        run: |
          set -euo pipefail
          forbidden_paths=(
            "tools/compose_applicant_submission_package.py"
            "tests/test_compose_applicant_submission_package.py"
            ".github/workflows/applicant-submission-package-proof.yml"
            "APEX_BLUEPRINT_V1_JOB_RESTORE.md"
            "docs/APEX_BLUEPRINT_V1_JOB_RESTORE_20260819_MULTIFIELD.md"
            "scripts/restore-helix-flagship-depth.mjs"
            "scripts/validate-helix-flagship-depth.mjs"
            "scripts/reconcile-helix-company-cardinality.mjs"
            "scripts/reconcile-v21-runtime-stars.mjs"
            "scripts/reconcile-company-constellation-taxonomy.mjs"
            "scripts/upgrade-helix-projection-stage-validator.mjs"
            "scripts/upgrade-helix-projection-stage-validator-v2.mjs"
            ".github/workflows/helix-effective-once.yml"
            ".github/workflows/helix-projection-promote.yml"
            ".github/helix-effective-trigger-20260809.txt"
          )
          for path in "${forbidden_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "retired resurrection surface exists: $path" >&2
              exit 1
            fi
          done

          forbidden_references=(
            "restore-helix-flagship-depth.mjs"
            "validate-helix-flagship-depth.mjs"
            "reconcile-helix-company-cardinality.mjs"
            "reconcile-v21-runtime-stars.mjs"
            "reconcile-company-constellation-taxonomy.mjs"
            "upgrade-helix-projection-stage-validator.mjs"
            "upgrade-helix-projection-stage-validator-v2.mjs"
          )
          for token in "${forbidden_references[@]}"; do
            if grep -R --line-number --fixed-strings "$token" \
              .github/workflows build.sh scripts tools 2>/dev/null; then
              echo "retired self-heal invocation reintroduced: $token" >&2
              exit 1
            fi
          done

          if grep -R --line-number --fixed-strings \
            "ready_for_human_submission" tools scripts 2>/dev/null; then
            echo "submission-readiness semantic authority reintroduced into preparation code" >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings \
            "READY_FOR_HUMAN_SUBMISSION" tools scripts 2>/dev/null; then
            echo "submission-ready lifecycle label reintroduced into preparation code" >&2
            exit 1
          fi

      - name: Check out exact eradicated Helix runtime
        uses: actions/checkout@v6
        with:
          repository: GlacierEQ/job-app-helix
          ref: ${{ env.HELIX_SAFE_SHA }}
          path: .helix-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Helix runtime
        run: python -m pip install -e ./.helix-runtime

      - name: Prove retired submission transport is absent
        run: |
          python - <<'PY'
          from pathlib import Path
          from job_app_helix import application_operations as operations

          source = Path(operations.__file__).read_text(encoding="utf-8")
          forbidden = (
              "class JsonApiApplicationAdapter",
              "SUBMISSION_PACKET.json",
              'method="POST"',
              '"status": "SUBMITTED" if 200 <= response.status < 300',
              'raise ValueError("SUBMITTED requires external_reference")',
          )
          assert not hasattr(operations, "JsonApiApplicationAdapter")
          for signature in forbidden:
              assert signature not in source, signature
          print("Helix retired submission transport: ABSENT")
          PY

      - name: Prove retained preparation API remains operational
        run: |
          job-app-helix --help >/dev/null
          python - <<'PY'
          from job_app_helix.application_operations import (
              ApplicationStore,
              ManualApplicationAdapter,
              compile_application_lifecycle,
          )

          assert ApplicationStore is not None
          assert ManualApplicationAdapter is not None
          assert compile_application_lifecycle is not None
          print("Helix preparation API: AVAILABLE")
          PY

      - name: Emit runtime integrity receipt
        shell: bash
        run: |
          set -euo pipefail
          retired="${RETIRED_HELIX_SHA_A}${RETIRED_HELIX_SHA_B}"
          mkdir -p helix-runtime-integrity
          cat > helix-runtime-integrity/receipt.json <<JSON
          {
            "schema": "glaciereq.helix-runtime-integrity.v4",
            "helix_sha": "$HELIX_SAFE_SHA",
            "retired_helix_sha": "$retired",
            "retired_runtime_pin_present_in_workflows": false,
            "legacy_submission_transport_present": false,
            "submission_package_composer_present": false,
            "submission_readiness_semantic_authority_present": false,
            "flagship_self_heal_present": false,
            "source_rewriter_reconciliation_present": false,
            "write_capable_projection_regenerator_present": false,
            "validator_self_upgrade_present": false,
            "preparation_api_available": true,
            "external_submission_performed": false,
            "state": "SAFE_RUNTIME_VERIFIED"
          }
          JSON

      - name: Upload runtime integrity receipt
        uses: actions/upload-artifact@v4
        with:
          name: helix-runtime-integrity
          path: helix-runtime-integrity/receipt.json
          if-no-files-found: error
