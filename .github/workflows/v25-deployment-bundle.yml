name: V25 Deployment Bundle

on:
  push:
    branches: [main]
    paths:
      - "deployment/vercel-source-bridge/**"
      - "site-v15/**"
      - "projects/github-merge-authority-proof/**"
      - "scripts/runner_verify.py"
      - "scripts/apply-complete-web-design.mjs"
      - "scripts/activate-atlas-runtime.mjs"
      - "scripts/validate-atlas-interaction.mjs"
      - "tests/atlas-runtime.test.mjs"
      - "scripts/validate-algerian-display.mjs"
      - "scripts/harden-public-proof-surface.mjs"
      - "scripts/validate-public-proof-surface.mjs"
      - "scripts/build-v25-deployment-bundle.mjs"
      - "scripts/build-v25-effective-production.mjs"
      - "scripts/sync-helix-projection.mjs"
      - "scripts/sync-helix-projection-effective.mjs"
      - "scripts/verify-v25-v26-runtime.mjs"
      - "scripts/validate-github-merge-authority-public-readback.mjs"
      - "package.json"
      - ".github/workflows/v25-deployment-bundle.yml"
  pull_request:
    paths:
      - "deployment/vercel-source-bridge/**"
      - "site-v15/**"
      - "projects/github-merge-authority-proof/**"
      - "scripts/runner_verify.py"
      - "scripts/apply-complete-web-design.mjs"
      - "scripts/activate-atlas-runtime.mjs"
      - "scripts/validate-atlas-interaction.mjs"
      - "tests/atlas-runtime.test.mjs"
      - "scripts/validate-algerian-display.mjs"
      - "scripts/harden-public-proof-surface.mjs"
      - "scripts/validate-public-proof-surface.mjs"
      - "scripts/build-v25-deployment-bundle.mjs"
      - "scripts/build-v25-effective-production.mjs"
      - "scripts/sync-helix-projection.mjs"
      - "scripts/sync-helix-projection-effective.mjs"
      - "scripts/verify-v25-v26-runtime.mjs"
      - "scripts/validate-github-merge-authority-public-readback.mjs"
      - "package.json"
      - ".github/workflows/v25-deployment-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile current Helix projection without source mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-helix-projection-effective.mjs
      - name: Run full presentation regression suite
        run: npm test
      - name: Execute V21 through V26 runtime verifiers
        run: node scripts/verify-v25-v26-runtime.mjs
      - name: Build deterministic self-contained deployment from current projection
        shell: bash
        run: |
          set -euo pipefail
          HELIX_COMMIT="$(node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('site-v15/data/helix-root.receipt.json','utf8')); if(!/^[a-f0-9]{40}$/.test(r.source_commit||'')) process.exit(2); process.stdout.write(r.source_commit)")"
          node scripts/build-v25-effective-production.mjs \
            --source-commit "${{ github.sha }}" \
            --helix-commit "$HELIX_COMMIT" \
            --output-dir artifacts/v25-deployment
      - name: Verify deployment file contract
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/v25-deployment/api/index.js
          test -s artifacts/v25-deployment/vercel.json
          test -s artifacts/v25-deployment/deployment-manifest.json
          test "$(python - <<'PY'
          import json
          p=json.load(open('artifacts/v25-deployment/deployment-manifest.json'))
          print(len(p['deployment_files']))
          PY
          )" = "2"
          node --check artifacts/v25-deployment/api/index.js
      - name: Upload exact V25 deployment package
        uses: actions/upload-artifact@v4
        with:
          name: v25-deployment-${{ github.sha }}
          path: artifacts/v25-deployment
          if-no-files-found: error
          retention-days: 30
