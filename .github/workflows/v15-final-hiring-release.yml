name: V15 Final Hiring Release

on:
  pull_request:
    paths:
      - 'RESUME.md'
      - 'RESUME_ATS.md'
      - 'site-v15/**'
      - 'deployment/vercel-source-bridge/**'
      - 'deployment-receipts/V15_*'
      - '.github/workflows/v15-final-hiring-release.yml'
  push:
    branches: [main]
    paths:
      - 'RESUME.md'
      - 'RESUME_ATS.md'
      - 'site-v15/**'
      - 'deployment/vercel-source-bridge/**'
      - 'deployment-receipts/V15_*'
      - '.github/workflows/v15-final-hiring-release.yml'

permissions:
  contents: read

concurrency:
  group: v15-final-hiring-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate WHATWG source-bridge request parsing
        run: node --test deployment/vercel-source-bridge/proxy.test.js

      - name: Validate PSYSOC-X calibrated hiring system
        run: node site-v15/scripts/validate.mjs

      - name: Verify downloadable résumé signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pdf = Path('site-v15/downloads/Casey_Barton_Resume.pdf').read_bytes()
          ats = Path('RESUME_ATS.md').read_bytes()
          assert pdf.startswith(b'%PDF-'), 'Résumé PDF signature invalid'
          assert b'CASEY DEL CARPIO BARTON' in ats, 'ATS résumé identity missing'
          assert len(pdf) > 8_000, 'Résumé PDF unexpectedly small'
          assert len(ats) > 3_000, 'ATS résumé unexpectedly small'
          print({'pdf_bytes': len(pdf), 'ats_bytes': len(ats), 'status': 'PASS'})
          PY

      - name: Emit immutable validation receipt
        run: |
          mkdir -p .verification-artifacts
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = [
              'RESUME.md',
              'RESUME_ATS.md',
              'site-v15/index.html',
              'site-v15/resume/index.html',
              'site-v15/master/index.html',
              'site-v15/machine/index.html',
              'site-v15/mesh/index.html',
              'site-v15/data/portfolio.json',
              'site-v15/data/company-families.json',
              'site-v15/data/psysoc-x-profiles.json',
              'site-v15/downloads/Casey_Barton_Resume.pdf',
          ]
          files = {}
          for path in paths:
              data = Path(path).read_bytes()
              files[path] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          receipt = {
              'schema': 'glaciereq.v15-hiring-release-validation.v1',
              'commit': os.environ.get('GITHUB_SHA'),
              'status': 'PASS',
              'routes': ['/', '/resume/', '/master/', '/machine/', '/mesh/'],
              'psysoc_x_profiles': ['recruiter', 'master', 'machine', 'mesh'],
              'facts_invariant': True,
              'scripts': 0,
              'external_actions': 0,
              'files': files,
          }
          Path('.verification-artifacts/v15-validation-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload V15 verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: v15-final-hiring-release-receipt
          path: .verification-artifacts/v15-validation-receipt.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
