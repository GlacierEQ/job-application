name: Materialize V20 First Star Bridge

on:
  push:
    branches:
      - webdev/v20-first-star-production-bridge
    paths:
      - ".github/workflows/materialize-v20-first-star-bridge.yml"

permissions:
  contents: write

concurrency:
  group: materialize-v20-first-star-bridge
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bridge branch
        uses: actions/checkout@v4
        with:
          ref: webdev/v20-first-star-production-bridge
          fetch-depth: 1
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply exact V20 first-star bridge delta
        run: python3 scripts/_materialize_v20_first_star_bridge.py
      - name: Run bridge unit tests
        run: node --test deployment/vercel-source-bridge/proxy.test.js
      - name: Assert V20 exact pins and release boundary
        run: |
          node - <<'NODE'
          const bridge = require('./deployment/vercel-source-bridge/api/proxy');
          if (bridge.constants.SOURCE_COMMIT !== 'be5ddaa49d60ee551177376a67b92d681768e088') throw new Error('website pin drift');
          if (bridge.constants.HELIX_COMMIT !== '87dd202abbff08ad2e7f6cf57739a8bdd661bd46') throw new Error('Helix pin drift');
          if (!bridge.resolveSourceUrl('assets/site.css').includes('/be5ddaa49d60ee551177376a67b92d681768e088/site-v15/assets/site.css')) throw new Error('source resolver drift');
          NODE
      - name: Commit bridge delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/vercel-source-bridge/api/proxy.js deployment/vercel-source-bridge/proxy.test.js
          git diff --cached --check
          git commit -m "bridge(v20): pin first evidence-driven star motion"
          git push origin HEAD:webdev/v20-first-star-production-bridge
