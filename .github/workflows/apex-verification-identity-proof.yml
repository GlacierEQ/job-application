name: APEX Verification Identity Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/workflow-verification-sources.json'
      - 'tools/workflow_evidence_manifest.py'
      - 'tools/workflow_verification_identity.py'
      - 'tools/workflow_evidence_freshness.py'
      - 'tools/workflow_recruiter_brief.py'
      - 'tools/workflow_recruiter_snapshot.py'
      - 'tests/test_workflow_verification_source_registry.py'
      - 'tests/test_workflow_verification_identity.py'
      - 'tests/test_workflow_recruiter_snapshot.py'
      - 'deployment/vercel-source-bridge/api/workflow-topology-proxy.js'
      - '.github/workflows/apex-verification-identity-proof.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile verification identity runtime
        run: |
          python -m py_compile \
            tools/workflow_evidence_manifest.py \
            tools/workflow_verification_identity.py \
            tools/workflow_evidence_freshness.py \
            tools/workflow_role_lens.py \
            tools/workflow_recruiter_brief.py \
            tools/workflow_recruiter_snapshot.py

      - name: Run adversarial verification identity and snapshot tests
        run: |
          python -m unittest \
            tests.test_workflow_verification_source_registry \
            tests.test_workflow_verification_identity \
            tests.test_workflow_evidence_freshness \
            tests.test_workflow_role_lens \
            tests.test_workflow_recruiter_brief \
            tests.test_workflow_recruiter_snapshot -v

      - name: Materialize source-native workflow topology
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const handler = require('./deployment/vercel-source-bridge/api/workflow-topology-proxy.js');
          const headers = new Map();
          const res = {
            statusCode: 200,
            setHeader(name, value) { headers.set(String(name).toLowerCase(), value); },
            getHeader(name) { return headers.get(String(name).toLowerCase()); },
            end(chunk = '') { this.body = Buffer.isBuffer(chunk) ? chunk : Buffer.from(String(chunk)); },
          };
          Promise.resolve(handler({ url: '/data/workflow-topology.json' }, res)).then(() => {
            if (res.statusCode !== 200) throw new Error(`topology_http_${res.statusCode}`);
            const topology = JSON.parse(res.body.toString('utf8'));
            if (topology.schema !== 'glaciereq.workflow-topology.v1') throw new Error('topology_schema');
            if (!/^[a-f0-9]{64}$/.test(topology.receipt_sha256 || '')) throw new Error('topology_receipt');
            fs.writeFileSync('/tmp/workflow-topology.json', JSON.stringify(topology));
          }).catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Execute one-pass exact-identity recruiter snapshot
        run: |
          AS_OF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python tools/workflow_recruiter_snapshot.py \
            --topology /tmp/workflow-topology.json \
            --verification-sources config/workflow-verification-sources.json \
            --output /tmp/recruiter-snapshot.json \
            --top-k 2 \
            --as-of "$AS_OF" \
            --github-token-env GLACIEREQ_PUBLIC_GITHUB_TOKEN

      - name: Prove composed identity freshness and recruiter briefs
        run: |
          python - <<'PY'
          import json

          snapshot = json.load(open('/tmp/recruiter-snapshot.json', encoding='utf-8'))
          manifest = snapshot['evidence_manifest']
          identity = snapshot['identity_proof']
          freshness = snapshot['freshness']
          briefs = snapshot['recruiter_briefs']

          assert snapshot['schema'] == 'glaciereq.recruiter-proof-snapshot.v1'
          assert len(snapshot['receipt_sha256']) == 64
          assert snapshot['policy']['identity_gate_required_before_freshness'] is True
          assert snapshot['policy']['topology_receipt_verified_before_evidence_fetch'] is True
          assert snapshot['policy']['missing_proof_receives_zero_freshness_credit'] is True

          assert identity['schema'] == 'glaciereq.verification-identity-proof.v1'
          assert len(identity['verified_entries']) == len(manifest['entries'])
          assert identity['exact_path_bound_entries'] == len(identity['verified_entries'])
          assert all(entry['workflow_path_bound'] is True for entry in identity['verified_entries'])
          assert all(entry['workflow_path'].startswith('.github/workflows/') for entry in identity['verified_entries'])

          assert freshness['schema'] == 'glaciereq.evidence-freshness.v1'
          assert snapshot['receipts']['freshness_sha256'] == freshness['receipt_sha256']
          assert snapshot['coverage']['identity_verified_entries'] == snapshot['coverage']['manifest_entries']
          assert snapshot['coverage']['exact_path_bound_entries'] == snapshot['coverage']['manifest_entries']
          assert set(briefs) == {'recruiter', 'engineering-lead', 'systems-architect'}
          assert all(brief['schema'] == 'glaciereq.recruiter-proof-brief.v2' for brief in briefs.values())
          assert all(brief['freshness_receipt_sha256'] == freshness['receipt_sha256'] for brief in briefs.values())
          assert all(brief['briefs'] for brief in briefs.values())

          print(json.dumps({
              'status': 'PASS',
              'snapshot_receipt_sha256': snapshot['receipt_sha256'],
              'topology_receipt_sha256': snapshot['topology_receipt_sha256'],
              'identity_receipt_sha256': snapshot['receipts']['identity_sha256'],
              'freshness_receipt_sha256': snapshot['receipts']['freshness_sha256'],
              'verified_entries': snapshot['coverage']['identity_verified_entries'],
              'missing_systems': snapshot['coverage']['missing_systems'],
              'roles': snapshot['coverage']['roles'],
              'top_flows': {role: brief['briefs'][0]['flow_id'] for role, brief in briefs.items()},
          }, indent=2))
          PY
