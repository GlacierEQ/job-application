name: V16 Normalize Source

on:
  push:
    branches: [release/v16-signal-architecture]
    paths:
      - '.github/workflows/v16-normalize-source.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v16-signal-architecture
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize committed source
        run: |
          python -m pip install --disable-pip-version-check ftfy==6.3.1
          python - <<'PY'
          from pathlib import Path
          from ftfy import fix_text

          html_paths = [
              Path('site-v15/index.html'),
              Path('site-v15/resume/index.html'),
              Path('site-v15/master/index.html'),
              Path('site-v15/mesh/index.html'),
              Path('site-v15/machine/index.html'),
              Path('site-v15/404.html'),
          ]

          def decode_source(path: Path) -> str:
              data = path.read_bytes()
              try:
                  return data.decode('utf-8')
              except UnicodeDecodeError:
                  for encoding in ('cp1252', 'latin-1'):
                      try:
                          return data.decode(encoding)
                      except UnicodeDecodeError:
                          continue
                  raise

          for path in html_paths:
              text = fix_text(decode_source(path))
              text = text.replace('<span external actions</span>', '<span>external actions</span>')
              if 'href="/assets/site.systems.css"' not in text:
                  text = text.replace(
                      '<link rel="stylesheet" href="/assets/site.css">',
                      '<link rel="stylesheet" href="/assets/site.css">\n  <link rel="stylesheet" href="/assets/site.systems.css">',
                  )
              text = ''.join(ch if ord(ch) < 128 else f'&#{ord(ch)};' for ch in text)
              path.write_text(text, encoding='utf-8')

          css_path = Path('site-v15/assets/site.systems.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* V16 technical print hardening */'
          if marker not in css:
              css += '''\n\n/* V16 technical print hardening */\n@media print {\n  .terminal,.code-block,.tree,.layer,.branch,.card,.screen,.cockpit {\n    background:#fff!important;\n    color:#111!important;\n    box-shadow:none!important;\n    border-color:#c9d2d0!important;\n  }\n  .terminal pre,.terminal code,.code-block,.branch code,.screen-label,.status-line,.pipe,.receipt,.method-step {\n    color:#111!important;\n    background:#fff!important;\n  }\n  .terminal *, .code-block *, .tree *, .layer *, .branch *, .card *, .screen *, .cockpit * {\n    text-shadow:none!important;\n  }\n}\n'''
              css_path.write_text(css, encoding='utf-8')

          Path('.github/workflows/v16-normalize-source.yml').unlink()
          PY

      - name: Commit normalized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v15 .github/workflows/v16-normalize-source.yml
          git commit -m 'Normalize V16 source encoding and technical print output'
          git push origin HEAD:release/v16-signal-architecture
