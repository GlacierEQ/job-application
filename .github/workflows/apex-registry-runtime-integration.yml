name: APEX Registry Runtime Integration

on:
  push:
    branches:
      - apex/job-restore-runtime-registry-consumption

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[registry-runtime-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate generated verification registry into executable runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          recruiter = Path('deployment/vercel-source-bridge/api/workflow-recruiter-proxy.js')
          source = recruiter.read_text()
          pattern = re.compile(
              r"// Runtime projection of config/workflow-verification-sources\.json\. A parity test prevents drift\.\n"
              r"const VERIFICATION_SOURCES = Object\.freeze\(\{.*?\n\}\);\n\n"
              r"let liveFreshnessCache",
              re.S,
          )
          replacement = (
              "// Generated from config/workflow-verification-sources.json; compiler validation and deep freeze are enforced upstream.\n"
              "const VERIFICATION_SOURCES = require('./workflow-verification-sources.generated.js');\n\n"
              "let liveFreshnessCache"
          )
          source, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f'recruiter_registry_projection_anchor_count:{count}')
          recruiter.write_text(source)

          builder = Path('scripts/build-v25-deployment-bundle.mjs')
          source = builder.read_text()
          anchor = "  'deployment/vercel-source-bridge/api/workflow-topology-loader-patch.js',\n  'deployment/vercel-source-bridge/api/workflow-recruiter-proxy.js',"
          replacement = "  'deployment/vercel-source-bridge/api/workflow-topology-loader-patch.js',\n  'deployment/vercel-source-bridge/api/workflow-verification-sources.generated.js',\n  'deployment/vercel-source-bridge/api/workflow-recruiter-proxy.js',"
          if source.count(anchor) != 1:
              raise SystemExit(f'bundle_module_anchor_count:{source.count(anchor)}')
          source = source.replace(anchor, replacement)
          marker = "  if (!modules['api/workflow-recruiter-proxy.js'].includes('V30-RECRUITER-PROOF-RUNTIME')) {"
          guard = "  if (!modules['api/workflow-verification-sources.generated.js'].includes('module.exports = deepFreeze(REGISTRY)')) {\n    throw new Error('generated_verification_registry_missing');\n  }\n"
          if source.count(marker) != 1:
              raise SystemExit(f'bundle_registry_guard_anchor_count:{source.count(marker)}')
          source = source.replace(marker, guard + marker)
          builder.write_text(source)

          bootstrap = Path('deployment/vercel-source-bridge/bootstrap-v25.test.mjs')
          source = bootstrap.read_text()
          if source.count('const EXPECTED_MODULE_COUNT = 16;') != 1:
              raise SystemExit('bootstrap_module_count_anchor')
          source = source.replace('const EXPECTED_MODULE_COUNT = 16;', 'const EXPECTED_MODULE_COUNT = 17;')
          anchor = "  assert.ok(Object.hasOwn(first.module_sha256, 'api/workflow-recruiter-proxy.js'));"
          replacement = "  assert.ok(Object.hasOwn(first.module_sha256, 'api/workflow-verification-sources.generated.js'));\n" + anchor
          if source.count(anchor) != 1:
              raise SystemExit('bootstrap_manifest_registry_anchor')
          source = source.replace(anchor, replacement)
          anchor = "  assert.ok(source.includes('api/workflow-recruiter-proxy.js'));"
          replacement = "  assert.ok(source.includes('api/workflow-verification-sources.generated.js'));\n" + anchor
          if source.count(anchor) != 1:
              raise SystemExit('bootstrap_source_registry_anchor')
          source = source.replace(anchor, replacement)
          bootstrap.write_text(source)

          effective = Path('scripts/build-v25-effective-production.mjs')
          source = effective.read_text()
          if source.count('const EXPECTED_BUNDLE_MODULE_COUNT = 16;') != 1:
              raise SystemExit('effective_module_count_anchor')
          source = source.replace('const EXPECTED_BUNDLE_MODULE_COUNT = 16;', 'const EXPECTED_BUNDLE_MODULE_COUNT = 17;')
          anchor = "    requireValue(bundle.includes('api/workflow-recruiter-proxy.js'), 'effective_bundle_recruiter_module_missing');"
          replacement = "    requireValue(bundle.includes('api/workflow-verification-sources.generated.js'), 'effective_bundle_generated_verification_registry_missing');\n" + anchor
          if source.count(anchor) != 1:
              raise SystemExit('effective_registry_anchor')
          source = source.replace(anchor, replacement)
          effective.write_text(source)

          parity = Path('deployment/vercel-source-bridge/workflow-recruiter-registry-parity.test.js')
          parity.write_text("""const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const recruiterProxy = require('./api/workflow-recruiter-proxy.js');
          const generatedRegistry = require('./api/workflow-verification-sources.generated.js');

          const registryPath = path.resolve(__dirname, '../../config/workflow-verification-sources.json');

          test('public recruiter runtime consumes the generated verification-source registry exactly', () => {
            const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
            assert.equal(registry.schema, 'glaciereq.verification-source-registry.v1');
            const expected = Object.fromEntries(
              Object.entries(registry.repositories)
                .sort(([left], [right]) => left.localeCompare(right))
                .map(([repository, config]) => [repository, {
                  workflow_names: [...config.workflow_names],
                  workflow_paths: config.workflow_paths === null ? null : [...config.workflow_paths],
                  branch_policy: config.branch_policy,
                }]),
            );

            assert.strictEqual(recruiterProxy.constants.VERIFICATION_SOURCES, generatedRegistry);
            assert.deepEqual(generatedRegistry, expected);
            assert.equal(Object.isFrozen(generatedRegistry), true);
            for (const source of Object.values(generatedRegistry)) {
              assert.equal(Object.isFrozen(source), true);
              assert.equal(Object.isFrozen(source.workflow_names), true);
              if (source.workflow_paths !== null) assert.equal(Object.isFrozen(source.workflow_paths), true);
            }
          });
          """.replace('          ', ''))
      - name: Execute integration proof
        run: |
          node --check deployment/vercel-source-bridge/api/workflow-recruiter-proxy.js
          node --check scripts/build-v25-deployment-bundle.mjs
          node --check scripts/build-v25-effective-production.mjs
          node scripts/generate-workflow-verification-registry.mjs --check
          node --test deployment/vercel-source-bridge/workflow-recruiter-registry-parity.test.js
          node --test deployment/vercel-source-bridge/workflow-recruiter-proxy.test.js
          node --test deployment/vercel-source-bridge/bootstrap-v25.test.mjs
      - name: Commit verified integration
        run: |
          rm .github/workflows/apex-registry-runtime-integration.yml
          git config user.name 'GlacierEQ APEX Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add deployment/vercel-source-bridge/api/workflow-recruiter-proxy.js \
                  deployment/vercel-source-bridge/workflow-recruiter-registry-parity.test.js \
                  deployment/vercel-source-bridge/bootstrap-v25.test.mjs \
                  scripts/build-v25-deployment-bundle.mjs \
                  scripts/build-v25-effective-production.mjs \
                  .github/workflows/apex-registry-runtime-integration.yml
          git commit -m 'APEX: consume generated verification registry in recruiter runtime [registry-runtime-integrated]'
          git push origin HEAD:apex/job-restore-runtime-registry-consumption
