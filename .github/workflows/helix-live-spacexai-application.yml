name: Helix Live SpaceXAI Application

on:
  pull_request:
    paths:
      - "RESUME_ATS.md"
      - "site-v15/data/resume.json"
      - "scripts/export_helix_candidate_profile.py"
      - "targets/spacexai/**"
      - ".github/workflows/helix-live-spacexai-application.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HELIX_SHA: 725e785453ab01350d7b273c94ddb4dac70501af

jobs:
  live-target-application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hiring repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out exact Helix runtime
        uses: actions/checkout@v6
        with:
          repository: GlacierEQ/job-app-helix
          ref: ${{ env.HELIX_SHA }}
          path: .helix-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Helix runtime
        run: python -m pip install -e ./.helix-runtime

      - name: Export maintained production CandidateProfile
        run: |
          mkdir -p helix-live/state helix-live/packets
          python scripts/export_helix_candidate_profile.py \
            --source site-v15/data/resume.json \
            --output helix-live/state/COMPILED_CANDIDATE_PROFILE.json
          python scripts/export_helix_candidate_profile.py \
            --source site-v15/data/resume.json \
            --output helix-live/state/COMPILED_CANDIDATE_PROFILE.json \
            --check

      - name: Verify maintained profile provenance before live execution
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source_path = Path("site-v15/data/resume.json")
          profile_path = Path("helix-live/state/COMPILED_CANDIDATE_PROFILE.json")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          profile = json.loads(profile_path.read_text(encoding="utf-8"))

          canonical = json.dumps(
              source,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          source_digest = hashlib.sha256(canonical).hexdigest()
          provenance = profile["provenance"]

          assert profile["schema"] == "glaciereq.job-app-helix.candidate-profile.v1"
          assert profile["name"] == source["basics"]["name"]
          assert profile["headline"]
          assert profile["summary"]
          assert profile["skills"]
          assert profile["experience"]
          assert profile["achievements"]
          assert provenance["source"] == "site-v15/data/resume.json"
          assert provenance["source_sha256"] == source_digest
          assert provenance["projection"] == "scripts/export_helix_candidate_profile.py"
          assert provenance["evidence_policy"] == "projection_may_not_exceed_source_resume"

          print(json.dumps({
              "profile_id": profile["profile_id"],
              "source_sha256": source_digest,
              "skills": len(profile["skills"]),
              "experience": len(profile["experience"]),
              "achievements": len(profile["achievements"]),
          }, indent=2, sort_keys=True))
          PY

      - name: Execute maintained profile against live SpaceXAI inventory
        run: |
          job-app-helix-target-application \
            --manifest targets/spacexai/target_manifest.json \
            --profile helix-live/state/COMPILED_CANDIDATE_PROFILE.json \
            --state-dir helix-live/state \
            --output-dir helix-live/packets \
            --database helix-live/applications.sqlite \
            --limit 4 \
            > helix-live/target-application-output.json

      - name: Verify live application-ready release
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("helix-live")
          release_path = root / "state" / "APPLICATION_READY_TARGET.json"
          cycle_path = root / "state" / "TARGET_APPLICATION_CYCLE_RECEIPT.json"
          profile_path = root / "state" / "COMPILED_CANDIDATE_PROFILE.json"
          for required in (release_path, cycle_path, profile_path):
              assert required.is_file(), f"missing required runtime artifact: {required}"

          release = json.loads(release_path.read_text(encoding="utf-8"))
          cycle = json.loads(cycle_path.read_text(encoding="utf-8"))
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          selected = release["selected"]
          discovered = cycle["target_cycle"]["discovery"]

          assert discovered["successful_source_count"] == 1
          assert discovered["opening_count"] >= 1
          assert cycle["application_ready"] is not None
          assert selected["company_id"]
          assert selected["opening_id"]
          assert selected["bundle_sha256"]
          assert selected["artifact_sha256"]
          assert profile["provenance"]["source"] == "site-v15/data/resume.json"
          assert profile["provenance"]["projection"] == "scripts/export_helix_candidate_profile.py"
          assert profile["provenance"]["evidence_policy"] == "projection_may_not_exceed_source_resume"

          print(json.dumps({
              "application_id": selected["application_id"],
              "opening_id": selected["opening_id"],
              "company_id": selected["company_id"],
              "lane": selected["lane"],
              "queue_rank": selected["queue_rank"],
              "priority_score": selected["priority_score"],
              "bundle_sha256": selected["bundle_sha256"],
              "opening_count": discovered["opening_count"],
              "profile_id": profile["profile_id"],
              "profile_source_sha256": profile["provenance"]["source_sha256"],
              "release_sha256": hashlib.sha256(release_path.read_bytes()).hexdigest(),
              "helix_sha": "725e785453ab01350d7b273c94ddb4dac70501af"
          }, indent=2, sort_keys=True))
          PY

      - name: Prepare exact live Greenhouse application fields
        run: |
          JOB_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("helix-live/state/APPLICATION_READY_TARGET.json").read_text())
          print(release["selected"]["opening_id"])
          PY
          )"
          job-app-helix-greenhouse-prepare \
            --release helix-live/state/APPLICATION_READY_TARGET.json \
            --profile helix-live/state/COMPILED_CANDIDATE_PROFILE.json \
            --board-key xai \
            --job-id "$JOB_ID" \
            --output helix-live/greenhouse-preparation.json \
            > helix-live/greenhouse-preparation-output.json

      - name: Bind production resume to exact live file field
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("helix-live/state/APPLICATION_READY_TARGET.json").read_text())
          packet_dir = Path(release["selected"]["packet_dir"])
          bundle = json.loads((packet_dir / "GREENHOUSE_APPLICATION_FIELDS.json").read_text())
          file_fields = [
              row["field"]
              for row in bundle["fields"]
              if row["field"]["field_type"] == "input_file"
          ]
          resume_fields = [
              field for field in file_fields
              if "resume" in f'{field["label"]} {field["name"]}'.casefold()
              or "cv" in f'{field["label"]} {field["name"]}'.casefold()
          ]
          assert len(resume_fields) == 1, (
              "expected exactly one live resume/CV file field, found "
              f"{[(f['name'], f['label']) for f in resume_fields]}"
          )
          payload = {
              "attachments": [{
                  "field_name": resume_fields[0]["name"],
                  "path": "RESUME_ATS.md",
                  "provenance": "GlacierEQ/job-application:RESUME_ATS.md@workflow-head"
              }]
          }
          destination = Path("helix-live/greenhouse-attachments.json")
          destination.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Build hash-bound Greenhouse final review packet
        id: finalize
        shell: bash
        run: |
          set +e
          job-app-helix-greenhouse-finalize \
            --preparation helix-live/greenhouse-preparation.json \
            --attachment-source helix-live/greenhouse-attachments.json \
            --output helix-live/greenhouse-final.json \
            > helix-live/greenhouse-final-output.json
          code=$?
          set -e
          if [[ "$code" != "0" && "$code" != "2" ]]; then
            echo "unexpected finalization exit code: $code" >&2
            exit "$code"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Verify final review integrity and remaining applicant decisions
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          final_path = Path("helix-live/greenhouse-final.json")
          assert final_path.is_file(), "final review artifact was not produced"
          final = json.loads(final_path.read_text(encoding="utf-8"))
          attachments = final["attachments"]
          assert len(attachments) == 1
          attachment = attachments[0]
          expected_resume = Path("RESUME_ATS.md").resolve()
          assert Path(attachment["path"]).resolve() == expected_resume
          assert attachment["sha256"] == hashlib.sha256(expected_resume.read_bytes()).hexdigest()
          assert final["resolved_required_count"] <= final["required_field_count"]
          unresolved = final["unresolved_required_fields"]
          ready = final["ready_for_human_submission"]
          assert ready is (len(unresolved) == 0)

          print(json.dumps({
              "application_id": final["application_id"],
              "opening_id": final["opening_id"],
              "required_field_count": final["required_field_count"],
              "resolved_required_count": final["resolved_required_count"],
              "unresolved_required_fields": unresolved,
              "ready_for_human_submission": ready,
              "attachment_sha256": attachment["sha256"],
              "final_receipt_sha256": final["receipt_sha256"],
              "helix_sha": "725e785453ab01350d7b273c94ddb4dac70501af"
          }, indent=2, sort_keys=True))
          PY

      - name: Upload live application final-review package
        uses: actions/upload-artifact@v4
        with:
          name: helix-live-spacexai-application
          path: |
            helix-live/state/
            helix-live/packets/
            helix-live/target-application-output.json
            helix-live/greenhouse-preparation.json
            helix-live/greenhouse-preparation-output.json
            helix-live/greenhouse-attachments.json
            helix-live/greenhouse-final.json
            helix-live/greenhouse-final-output.json
          if-no-files-found: error
