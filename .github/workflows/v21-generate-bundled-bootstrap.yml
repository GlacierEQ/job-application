name: V21 Generate Bundled Bootstrap

on:
  push:
    branches:
      - ops/v21-vercel-credential-probe
    paths:
      - .github/workflows/v21-generate-bundled-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webdev/v21-first-star-production-receipt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate bundled bootstrap from exact canonical bridge
        run: |
          set -euo pipefail
          git show d8c84f3032570b70033b6036ad528d94bb6837bb:deployment/vercel-source-bridge/api/proxy.js > /tmp/canonical-proxy.js
          actual=$(sha256sum /tmp/canonical-proxy.js | awk '{print $1}')
          expected=8af9f491dc8532ef2e6e43f5d040f0c4c5a4ff634ecc37a3d0f2f3ddcd93de96
          test "$actual" = "$expected"
          gzip -n -9 -c /tmp/canonical-proxy.js > /tmp/canonical-proxy.js.gz
          base64 -w0 /tmp/canonical-proxy.js.gz > /tmp/canonical-proxy.b64
          node - <<'NODE'
          const fs = require('fs');
          const bundle = fs.readFileSync('/tmp/canonical-proxy.b64', 'utf8');
          const source = `const crypto = require('node:crypto');
          const Module = require('node:module');
          const zlib = require('node:zlib');

          const EXPECTED_BRIDGE_SHA256 = '8af9f491dc8532ef2e6e43f5d040f0c4c5a4ff634ecc37a3d0f2f3ddcd93de96';
          const BUNDLED_BRIDGE_GZIP_BASE64 = '${bundle}';
          let handler = null;

          function loadHandler() {
            if (handler) return handler;
            const sourceBytes = zlib.gunzipSync(Buffer.from(BUNDLED_BRIDGE_GZIP_BASE64, 'base64'));
            const actualHash = crypto.createHash('sha256').update(sourceBytes).digest('hex');
            if (actualHash !== EXPECTED_BRIDGE_SHA256) {
              throw new Error('bundled bridge integrity check failed');
            }
            const compiled = new Module('glaciereq-v21-bundled-bridge.js', module);
            compiled.filename = 'glaciereq-v21-bundled-bridge.js';
            compiled.paths = module.paths;
            compiled._compile(sourceBytes.toString('utf8'), compiled.filename);
            if (typeof compiled.exports !== 'function') {
              throw new Error('bundled bridge export is not a handler');
            }
            handler = compiled.exports;
            return handler;
          }

          module.exports = async function bootstrap(req, res) {
            try {
              return await loadHandler()(req, res);
            } catch (error) {
              console.error('Bundled bridge bootstrap failure', error);
              res.statusCode = 502;
              res.setHeader('Content-Type', 'text/plain; charset=utf-8');
              res.setHeader('Cache-Control', 'no-store');
              res.setHeader('Retry-After', '60');
              res.end('Bundled bridge bootstrap unavailable');
            }
          };
          `;
          fs.writeFileSync('deployment/vercel-source-bridge/bootstrap-v21.js', source.replace(/^          /gm, ''));
          NODE
          node - <<'NODE'
          const bootstrap = require('./deployment/vercel-source-bridge/bootstrap-v21.js');
          let body = Buffer.alloc(0);
          const headers = new Map();
          const res = {
            statusCode: 200,
            setHeader(name, value) { headers.set(String(name).toLowerCase(), String(value)); },
            end(value = '') { body = Buffer.isBuffer(value) ? value : Buffer.from(String(value)); },
          };
          bootstrap({ url: '/api/proxy?path=__v21_verify' }, res).then(() => {
            const receipt = JSON.parse(body.toString('utf8'));
            if (res.statusCode !== 200 || receipt.status !== 'PASS' || receipt.schema !== 'glaciereq.v21-production-verification.v1') {
              throw new Error(`bundled bootstrap verifier failed: ${res.statusCode} ${body}`);
            }
            console.log(JSON.stringify({status:'PASS', release:receipt.release, stage:receipt.lockheed_martin.stage}, null, 2));
          }).catch((error) => { console.error(error); process.exit(1); });
          NODE
          echo "BOOTSTRAP_SHA256=$(sha256sum deployment/vercel-source-bridge/bootstrap-v21.js | awk '{print $1}')"
          echo "BOOTSTRAP_BYTES=$(wc -c < deployment/vercel-source-bridge/bootstrap-v21.js | tr -d ' ')"
      - name: Commit bundled bootstrap
        run: |
          set -euo pipefail
          git config user.name casey
          git config user.email GLACIER.EQUILIBRIUM@GMAIL.COM
          git add deployment/vercel-source-bridge/bootstrap-v21.js
          git commit -m 'security: bundle verified V21 bridge into deployment artifact'
          git push origin HEAD:webdev/v21-first-star-production-receipt
