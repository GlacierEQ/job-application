name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.txt'
      - '.agents/**'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.txt'
      - '.agents/**'
      - 'LICENSE*'

permissions:
  contents: read

jobs:
  test:
    name: Repository test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository tests (npm test)
        run: npm test

      # Local coverage gate (replaces the former external Codecov upload):
      # coverage.py measures tools/ and the report fails below the 80%
      # threshold configured in .coveragerc. No data leaves the runner.
      - name: Install coverage.py
        run: python3 -m pip install coverage

      - name: Enforce Python coverage threshold (tools, 80%)
        run: |
          python3 -m coverage run -m unittest tests/test_workflow_evidence_manifest.py tests/test_workflow_evidence_freshness.py
          python3 -m coverage report --fail-under=80

      # Production normalizes private/unpublished repository URLs before its
      # final dead-link check. CI must validate that same delivered state.
      - name: Normalize public GitHub links as in production
        run: node scripts/prune-unavailable-github-links.mjs

      - name: Verify no dead GitHub links on the public site
        run: node scripts/prune-unavailable-github-links.mjs --check
