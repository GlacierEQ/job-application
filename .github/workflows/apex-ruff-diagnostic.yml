name: APEX Ruff Diagnostic

on:
  pull_request:
    paths:
      - "tools/confirm_evidence_bound_review.py"
      - "tests/test_confirm_evidence_bound_review.py"
      - ".github/workflows/apex-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff
      - name: Capture lint and format diagnostics
        shell: bash
        run: |
          mkdir -p .verification-artifacts
          set +e
          ruff check tools/confirm_evidence_bound_review.py tests/test_confirm_evidence_bound_review.py --output-format=concise > .verification-artifacts/ruff-check.txt 2>&1
          echo $? > .verification-artifacts/ruff-check.exit
          ruff format --check tools/confirm_evidence_bound_review.py tests/test_confirm_evidence_bound_review.py > .verification-artifacts/ruff-format.txt 2>&1
          echo $? > .verification-artifacts/ruff-format.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: apex-ruff-diagnostic
          path: .verification-artifacts/
          if-no-files-found: error
