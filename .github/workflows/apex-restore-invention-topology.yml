name: APEX Restore Invention Topology

on:
  push:
    branches:
      - apex/restore-invention-topology-20260816

permissions:
  contents: write

jobs:
  render-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render restored topology
        run: node scripts/render-invention-evidence-map.mjs

      - name: Validate restored topology
        run: node scripts/validate-invention-evidence-map.mjs

      - name: Prove script-free public surface
        run: |
          if grep -Eiq '<script\b' site-v15/inventions/index.html; then
            echo 'invention surface introduced client-side script' >&2
            exit 1
          fi

      - name: Persist generated evidence surface
        run: |
          changes="$(git status --porcelain -- site-v15/data/invention-map.json site-v15/inventions/index.html)"
          if [ -z "$changes" ]; then
            echo 'generated surfaces already current'
            exit 0
          fi
          printf '%s\n' "$changes"
          git config user.name 'GlacierEQ APEX'
          git config user.email 'glacier.equilibrium@gmail.com'
          git add site-v15/data/invention-map.json site-v15/inventions/index.html
          git diff --cached --exit-code && {
            echo 'expected generated surfaces to be staged but index is empty' >&2
            exit 1
          }
          git commit -m 'build(portfolio): materialize restored invention topology'
          git push origin HEAD:apex/restore-invention-topology-20260816
