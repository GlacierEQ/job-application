name: V23 Signal Architecture

on:
  pull_request:
    paths:
      - 'site-v15/**'
      - 'RESUME.md'
      - 'deployment-receipts/V16_*'
      - '.github/workflows/v16-signal-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'site-v15/**'
      - 'RESUME.md'
      - 'deployment-receipts/V16_*'
      - '.github/workflows/v16-signal-architecture.yml'

permissions:
  contents: read

concurrency:
  group: v23-signal-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate V23 hiring-system signal architecture
        id: validate
        continue-on-error: true
        run: |
          mkdir -p .verification-artifacts
          set -o pipefail
          node site-v15/scripts/validate-site-v23.mjs 2>&1 | tee .verification-artifacts/v23-site-validation.log

      - name: Preserve structured success result
        if: steps.validate.outcome == 'success'
        run: |
          cp .verification-artifacts/v23-site-validation.log .verification-artifacts/v23-site-validation-result.json
          node -e "const fs=require('node:fs'); const result=JSON.parse(fs.readFileSync('.verification-artifacts/v23-site-validation-result.json','utf8')); if(result.status!=='PASS'||result.schema!=='glaciereq.site-signal-validation.v23') throw new Error('V23 structured result is not PASS')"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-site-validation-diagnostics
          path: |
            .verification-artifacts/v23-site-validation.log
            .verification-artifacts/v23-site-validation-result.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Enforce validation result
        if: steps.validate.outcome != 'success'
        run: |
          cat .verification-artifacts/v23-site-validation.log
          exit 1

      - name: Verify retained legacy resume binaries as historical artifacts only
        run: |
          python3 - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          manifest = json.loads(Path('site-v15/data/resume-artifacts.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'LEGACY_PRE_V23_NOT_CANONICAL'
          assert manifest['canonical_resume_version'] == '23.0.0-resource-grounded'
          for kind in ('pdf', 'docx'):
              entry = manifest['artifacts'][kind]
              data = Path('site-v15', entry['path']).read_bytes()
              assert len(data) == entry['bytes']
              assert sha256(data).hexdigest() == entry['sha256']
              assert entry['status'] == 'LEGACY_GENERATED_V17'
          ats = Path('site-v15/resume/ats.txt').read_bytes()
          assert b'CASEY DEL CARPIO BARTON' in ats
          assert len(ats) > 10_000
          print({'status': 'PASS', 'legacy_binary_integrity': True, 'canonical_resume_version': manifest['canonical_resume_version']})
          PY

      - name: Emit exact-head V23 validation receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          validation = json.loads(Path('.verification-artifacts/v23-site-validation-result.json').read_text())
          assert validation['status'] == 'PASS'
          paths = [
            'RESUME.md','site-v15/index.html','site-v15/resume/index.html','site-v15/master/index.html',
            'site-v15/mesh/index.html','site-v15/machine/index.html','site-v15/404.html',
            'site-v15/assets/site.css','site-v15/assets/site.systems.css',
            'site-v15/data/portfolio.json','site-v15/data/company-families.json',
            'site-v15/data/psysoc-x-profiles.json','site-v15/data/resume.json',
            'site-v15/data/resume-artifacts.json','site-v15/resume/ats.txt','site-v15/llms.txt'
          ]
          files = {}
          for p in paths:
            data = Path(p).read_bytes()
            files[p] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          receipt = {
            'schema': 'glaciereq.v23-signal-architecture-validation.v1',
            'commit': os.environ.get('GITHUB_SHA'),
            'status': validation['status'],
            'routes': validation['routes'],
            'profiles': validation['profiles'],
            'facts_invariant': validation['facts_invariant'],
            'proof': validation['proof'],
            'flagships': validation['flagships'],
            'company_families': validation['company_families'],
            'repositories': validation['repositories'],
            'scripts': validation['scripts'],
            'inline_styles': validation['inline_styles'],
            'visual_contracts': validation['visual_contracts'],
            'csp': validation['csp'],
            'resume': validation['resume'],
            'files': files,
          }
          out = Path('.verification-artifacts/v23-site-validation-receipt.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('.verification-artifacts/v23-site-validation-receipt.sha256').write_text(digest + '  v23-site-validation-receipt.json\n')
          PY

      - name: Upload V23 exact-head receipt
        uses: actions/upload-artifact@v4
        with:
          name: v23-signal-architecture-receipt
          path: |
            .verification-artifacts/v23-site-validation-receipt.json
            .verification-artifacts/v23-site-validation-receipt.sha256
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
