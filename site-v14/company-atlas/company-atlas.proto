syntax = "proto3";
package glaciereq.company_atlas.v1;

message CompanyAtlasSnapshot {
  SourceReceipt source = 1;
  repeated CompanyTrack tracks = 2;
}

message SourceReceipt {
  string repository = 1;
  string path = 2;
  string file_sha = 3;
  string generated_at = 4;
  string observed_main_sha = 5;
}

enum EvidenceState {
  EVIDENCE_STATE_UNSPECIFIED = 0;
  PROMOTED_SUBSET = 1;
  MAPPED_REFERENCE = 2;
  NO_DIRECT_EXHIBIT_VERIFIED = 3;
  HYPOTHESIS_PENDING_REGISTRY = 4;
  INTERNAL_CROSS_COMPANY_AUTHORITY = 5;
}

message CompanyTrack {
  string company_id = 1;
  string display_name = 2;
  string cluster = 3;
  uint32 mapped_repositories = 4;
  uint32 recruiter_admissible_repositories = 5;
  EvidenceState evidence_state = 6;
  string target_innovation = 7;
  repeated string capability_donors = 8;
}
