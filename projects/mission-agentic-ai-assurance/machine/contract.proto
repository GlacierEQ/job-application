syntax = "proto3";

package glaciereq.mission_assurance.v1;

// Compact machine contract. The Python reference implementation is the
// executable proof; this schema is the integration surface.

message EvidenceRef {
  string source_identity = 1;
  string source_ref = 2;          // commit:<sha40> | sha256:<hex64>
  string verification_state = 3; // VERIFIED | REPRODUCED
}

message AgentAction {
  string action_id = 1;
  string action = 2;
  bytes canonical_payload_json = 3;
  repeated EvidenceRef evidence = 4;
  double current_metric = 5;
  double baseline_metric = 6;
}

message AssurancePolicy {
  repeated string allowed_actions = 1;
  uint32 max_payload_bytes = 2;
  double max_drift = 3;
  bool require_evidence = 4;
  uint32 breaker_failure_threshold = 5;
}

message AssuranceReceipt {
  string schema = 1;
  string action_id = 2;
  string action = 3;
  string decision = 4; // ALLOW | DENY | EXECUTION_FAILED
  repeated string reasons = 5;
  string request_hash = 6;
  string policy_hash = 7;
  string evidence_digest = 8;
  double drift = 9;
  optional string outcome_hash = 10;
  string breaker_state = 11; // CLOSED | OPEN
  string receipt_id = 12;
}

service MissionAssurance {
  rpc Assess(AgentAction) returns (AssuranceReceipt);
}
