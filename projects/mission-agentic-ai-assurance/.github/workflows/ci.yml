name: Mission Agentic AI Assurance CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and adversarial tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce deterministic demo receipt
        env:
          PYTHONPATH: src
        run: |
          python scripts/demo.py > /tmp/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('/tmp/receipt.json').read_text())
          expected = json.loads(Path('proof/reproduced_receipt.json').read_text())
          assert actual == expected
          print(actual['receipt_id'])
          PY
      - name: Verify proof manifest
        env:
          PYTHONPATH: src
        run: python scripts/verify_proof.py
